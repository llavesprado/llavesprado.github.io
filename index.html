<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Contenido...</title>
    <style>
        body {
            display: flex;
            flex-direction: column; /* Para centrar verticalmente el texto y el spinner */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            text-align: center; /* Para centrar el texto "Cargando contenido..." */
        }

        .loading-message {
            font-size: 1.5em;
            color: #555;
            margin-bottom: 20px; /* Espacio entre el texto y el spinner */
        }

        .countdown-container {
            position: relative;
            width: 150px; /* Tamaño del círculo */
            height: 150px; /* Tamaño del círculo */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .countdown-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid rgba(0, 0, 0, 0.1); /* Borde gris claro para el fondo */
            border-top-color: #007bff; /* Borde azul para la parte que "avanza" */
            animation: spin 1s linear infinite; /* Animación de giro continuo */
        }

        /* Definición de la animación de giro */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .countdown-text {
            font-size: 3em; /* Tamaño grande para los números */
            font-weight: bold;
            color: #333;
            z-index: 10; /* Asegura que el texto esté sobre el círculo */
        }
    </style>
</head>
<body>

    <p class="loading-message">La siguiente página se está cargando...</p>
    <div class="countdown-container">
        <div class="countdown-circle"></div>
        <div class="countdown-text" id="countdown">5</div>
    </div>

    <script>
        const countdownElement = document.getElementById('countdown');
        let count = 5; // Inicia la cuenta regresiva desde 5

        const countdownInterval = setInterval(() => {
            count--; // Disminuye el contador

            if (count > 0) { // Solo actualiza y muestra el número si es mayor que 0
                countdownElement.textContent = count;
            } else {
                // Cuando count es 0 o menos, limpia el texto para que el "0" no aparezca
                countdownElement.textContent = "";
                clearInterval(countdownInterval); // Detiene la cuenta regresiva
                window.location.href = "inex.html"; // Redirige a jira.html
            }
        }, 1000); // Actualiza cada 1000 milisegundos (1 segundo)
    </script>

</body>
</html>
