<!DOCTYPE html>
<html lang="es" style="background-color: #1a1a2e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrajería Llaves - Avatar Sincronizado</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-cian-neon: #00f0ff;
            --color-principal: #00FFFF;
        }
        html { font-family: 'Orbitron', sans-serif; }
        body { background-color: transparent; margin: 0; padding: 10px; }

        .chatbot-container { 
            position: relative; height: 320px; display: flex; flex-direction: column; 
            background-color: #2c2c54; border-radius: 20px; overflow: hidden; 
            padding-top: 50px; padding-bottom: 40px; border: 2px solid var(--color-cian-neon);
        }

        /* Avatar */
        .robot-head {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 140px; border-radius: 50%; background: #1a1a2e;
            border: 2px solid var(--color-cian-neon); z-index: 5;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .robot-eyes { 
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 20px; z-index: 10; 
        }
        .robot-eye { 
            width: 18px; height: 40px; border-radius: 4px; background: var(--color-cian-neon);
            transition: all 0.3s ease;
        }
        .robot-mouth {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%); 
            width: 45px; height: 4px; background: var(--color-cian-neon);
            border-radius: 10px; z-index: 10; transition: transform 0.08s ease-out;
        }

        /* Estados de Animación */
        .eye-pulsing { animation: pulse 2s infinite alternate; }
        @keyframes pulse { 
            0% { box-shadow: 0 0 5px var(--color-principal); opacity: 0.7; }
            100% { box-shadow: 0 0 15px var(--color-principal); opacity: 1; }
        }
        .eye-talking { background: #00FF00 !important; box-shadow: 0 0 15px #00FF00; }
        .blink { transform: scaleY(0.1); }

        /* Visemas */
        .v-A { transform: translateX(-50%) scaleY(6) scaleX(1.3); }
        .v-E { transform: translateX(-50%) scaleY(4) scaleX(1.1); }
        .v-I { transform: translateX(-50%) scaleY(2) scaleX(0.8); }
        .v-O { transform: translateX(-50%) scaleY(5) scaleX(1.2); }
        .v-U { transform: translateX(-50%) scaleY(4.5) scaleX(1); }
        .v-silence { transform: translateX(-50%) scaleY(1) scaleX(1); }

        /* Interfaz */
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { font-size: 0.8rem; padding: 6px 12px; border-radius: 10px; max-width: 80%; }
        .bot { background: #3f3f6e; color: var(--color-cian-neon); border: 1px solid var(--color-cian-neon); align-self: flex-start; }
        .user { background: #4a90e2; color: white; align-self: flex-end; }
        
        .input-area { display: flex; padding: 10px; gap: 5px; background: #111122; }
        #userInput { flex-grow: 1; background: #2c2c54; border: 1px solid var(--color-cian-neon); color: white; border-radius: 20px; padding: 5px 15px; outline: none; }
        .btn { background: var(--color-cian-neon); color: #111122; font-weight: bold; padding: 5px 15px; border-radius: 20px; cursor: pointer; }

        .marquee { position: absolute; bottom: 0; width: 100%; background: #000; color: #FF00FF; font-size: 0.7rem; padding: 2px 0; border-top: 1px solid #FF00FF; }
    </style>
</head>
<body>

    <div class="chatbot-container">
        <div class="robot-head"></div>
        <div class="robot-eyes">
            <div id="eye-l" class="robot-eye eye-pulsing"></div>
            <div id="eye-r" class="robot-eye eye-pulsing"></div>
        </div>
        <div id="mouth" class="robot-mouth"></div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">¡Hola! Soy tu asistente de cerrajería. ¿En qué puedo ayudarte?</div>
        </div>

        <div class="marquee">
            <marquee>*** SERVICIO DE CERRAJERÍA LLAVES - CAMBIO DE CLAVE: $45.000 - TEL: 304 465 4556 ***</marquee>
        </div>

        <div class="input-area">
            <button class="btn" onclick="startVoice()">🎙️</button>
            <input type="text" id="userInput" placeholder="Escribe aquí...">
            <button class="btn" onclick="sendMessage()">OK</button>
        </div>
    </div>

    <script>
        const mouth = document.getElementById('mouth');
        const eyes = [document.getElementById('eye-l'), document.getElementById('eye-r')];
        const chatBox = document.getElementById('chatBox');
        let visemaInterval;

        const VISEMA_MAP = {
            'A': 'v-A', 'E': 'v-E', 'I': 'v-I', 'O': 'v-O', 'U': 'v-U',
            'B': 'v-silence', 'M': 'v-silence', 'P': 'v-silence',
            'R': 'v-U', 'S': 'v-I', 'T': 'v-I'
        };

        function syncMouth(text) {
            clearInterval(visemaInterval);
            let chars = text.toUpperCase().replace(/[^A-Z0-9]/g, '').split('');
            let i = 0;

            visemaInterval = setInterval(() => {
                if (i >= chars.length || !window.speechSynthesis.speaking) {
                    stopSpeaking();
                    return;
                }
                const char = chars[i];
                mouth.className = 'robot-mouth ' + (VISEMA_MAP[char] || 'v-I');
                i++;
            }, 75); // Velocidad de habla sincronizada
        }

        function stopSpeaking() {
            clearInterval(visemaInterval);
            mouth.className = 'robot-mouth v-silence';
            eyes.forEach(e => e.classList.remove('eye-talking'));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'es-ES';
            ut.rate = 1.0;

            ut.onstart = () => {
                eyes.forEach(e => e.classList.add('eye-talking'));
                syncMouth(text);
            };

            ut.onend = () => stopSpeaking();
            window.speechSynthesis.speak(ut);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
