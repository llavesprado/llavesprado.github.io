<!doctype html><html lang=es><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Secuencias de Texto Controladas (Alexander Amaya Atehortua)</title><style>body{display:flex;align-items:center;min-height:100vh;margin:0;background-color:#1a1a1a;font-family:'Courier New',monospace;cursor:default;overflow:hidden;flex-direction:column;position:relative}.content-wrapper{position:absolute;top:15%;left:5%;transform:translateY(-44%);display:flex;flex-direction:column;padding:0;box-sizing:border-box;border:none;background-color:transparent;box-shadow:none;border-radius:10px;opacity:0;width:80%;max-width:600px;height:239px}#typedTextContainer{color:#0ff;font-size:1.1em;white-space:pre-wrap;word-wrap:break-word;opacity:0;transition:opacity 1s ease-out;line-height:.7;text-align:left;position:relative;padding-left:20px;height:400%;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.word{opacity:0;display:inline-block;transition:opacity .2s ease-in-out}.blinking-box{position:absolute;width:9px;height:9px;border:2px solid #0ff;background-color:#0ff;box-shadow:0 0 7px rgba(0,255,255,.5);opacity:0;border-radius:0;z-index:10}.blinking-box.animate{animation:pause-blink-and-vanish 3s forwards}@keyframes pause-blink-and-vanish{0%{opacity:1}78.95%{opacity:1}80%{opacity:0}81%{opacity:1}82%{opacity:0}83%{opacity:1}84%{opacity:0}85%{opacity:1}86%{opacity:0}87%{opacity:1}88%{opacity:0}89%{opacity:1}90%{opacity:0}91%{opacity:1}92%{opacity:0}93%{opacity:1}94%{opacity:0}95%{opacity:1}96%{opacity:0}97%{opacity:1}98%{opacity:0}100%{opacity:0}}.additional-text{color:#fff;font-size:1.2em;text-align:left;width:100%;padding-left:20px;box-sizing:border-box;margin-top:0;margin-bottom:-5px;line-height:1.1}p.additional-text:first-of-type{margin-top:380px}</style><div id=contentWrapper class=content-wrapper><div id=animatedBox class=blinking-box></div><div id=typedTextContainer></div></div><p class=additional-text>PAGINA EN CONSTRUCCION.<p class=additional-text>SERVICIO TECNICO DE LLAVES<p class=additional-text>WHATSAPP<p class=additional-text>304-4654556</p><script>const typedTextContainer = document.getElementById('typedTextContainer');
        const animatedBox = document.getElementById('animatedBox');
        const contentWrapper = document.getElementById('contentWrapper');
        let words = [];
        let wordIndex = 0;
        let typingInterval;
        let currentSequenceIndex = 3;

        let isSequenceRunning = false;
        let hasSequenceFinished = false;

        // --- DEFINE AQUÍ TUS SECUENCIAS DE TEXTO ---
        const textSequences = [
            "INTELIGENCIA ARTIFICAL BELLO MEDELLIN COLOMBIA EXPERIMENTA SU MAXIMA CAPACIDAD TECNOLOGICA BASADO TAMBIEN EL GRAN EJEMPLO Y SE UTILIZA LA INTELIGENCIA ARTIFICIAL EN SU MAXIMO EXPLENDOR",  "PUESTO QUE INGELIGENCIA ARTIFICIAL ESTA DESARROLLANDOSE Y POR SUPUESTO OCULAR TODO EL PUESTO, LA INTELIGENCIA ARTIFICIAL DEL 100% AL ALCANSE DE TODOS",
            "SISTEMA INICIANDO EL SERVICIO DE ASISTENCIA VIRTUAL... IDENTIDAD INTELIGENTE GRACIAS A SUS API (SERVIDOR PHYTON) )Y OPEN IA GPT LENGUAJE NATURAL",          "INTERACCIONES ATRAVES DE SU VISION ARTIFICIAL - SERVICIO INICIADO.", "BELLO ANTIOQUIA COLOMBIA IA CORPORADA AVANZADA......", "INTEGRACION DE LA,INTELIGENCIA ARTIFICIAL DESENCAPSULADA EN COLOMBIA PARA SU REDIRECCIONAMIENTO AL ENTORNO" , " INTELIGENCIA ARTIFICIAL MEDELLIN BELLO COLOMBIA 2026..."

            // Añade más secuencias aquí si lo deseas.
        ];

        // Función para preparar el texto (dividirlo en palabras y envolverlas en <span>)
        function prepareText(text) {
            typedTextContainer.innerHTML = '';
            const lines = text.split('\n');
            words = [];

            lines.forEach((line, lineIdx) => {
                const lineWords = line.split(' ');
                lineWords.forEach(wordText => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = wordText + ' ';
                    wordSpan.classList.add('word');
                    typedTextContainer.appendChild(wordSpan);
                    words.push(wordSpan);
                });
                if (lineIdx < lines.length - 1) {
                    typedTextContainer.appendChild(document.createElement('br'));
                }
            });
            typedTextContainer.style.opacity = 1;
        }

        // Función para iniciar la secuencia actual
        function startCurrentSequence() {
            isSequenceRunning = true;
            hasSequenceFinished = false;

            clearInterval(typingInterval);
            wordIndex = 0;

            const phraseToDisplay = textSequences[currentSequenceIndex];
            prepareText(phraseToDisplay);

            animatedBox.classList.remove('animate');
            animatedBox.style.opacity = 0;

            animatedBox.style.left = `${5 - (animatedBox.offsetWidth / 2)}px`;

            typingInterval = setInterval(revealNextWord, 120);
        }

        // Función para revelar la siguiente palabra y mover el cuadro
        function revealNextWord() {
            if (wordIndex < words.length) {
                const currentWordSpan = words[wordIndex];

                const contentWrapperRect = contentWrapper.getBoundingClientRect();
                const wordRect = currentWordSpan.getBoundingClientRect();
                animatedBox.style.top = `${wordRect.top - contentWrapperRect.top + (wordRect.height / 2) - (animatedBox.offsetHeight / 1.9)}px`;
                animatedBox.style.opacity = 1;

                currentWordSpan.style.opacity = 1;
                wordIndex++;
            } else {
                clearInterval(typingInterval);
                animatedBox.style.opacity = 1;

                setTimeout(() => {
                    animatedBox.classList.add('animate');
                }, 100);

                animatedBox.removeEventListener('animationend', handleBoxAnimationEnd);
                animatedBox.addEventListener('animationend', handleBoxAnimationEnd, { once: true });
            }
        }

        // Función que se ejecuta cuando la animación de parpadeo del cuadro termina
        function handleBoxAnimationEnd() {
            typedTextContainer.style.opacity = 0;

            setTimeout(() => {
                animatedBox.style.opacity = 0;
                animatedBox.classList.remove('animate');

                currentSequenceIndex++;

                if (currentSequenceIndex < textSequences.length) {
                    setTimeout(() => {
                        startCurrentSequence();
                    }, 90);
                } else {
                    console.log("Todas las secuencias han terminado. Reiniciando...");
                    isSequenceRunning = false;
                    hasSequenceFinished = true;
                    currentSequenceIndex = 0;
                    setTimeout(() => {
                        startCurrentSequence();
                    }, 800);
                }
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', () => {
             contentWrapper.style.opacity = 1;
             startCurrentSequence();
        });</script>
