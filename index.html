<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Gemini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f4;
        }
        #chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #chatOutput {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }
        #chatOutput p {
            margin: 5px 0;
            line-height: 1.5;
        }
        #chatOutput p strong {
            color: #333;
        }
        #chatOutput .thinking {
            color: #888;
            font-style: italic;
        }
        #input-container {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        #userInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
            font-size: 16px;
            resize: none; /* Evita que el usuario redimensione el textarea */
        }
        #sendButton {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        #sendButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chatOutput">
            <p><strong>Asistente Llaves Prado:</strong> ¡Hola! Soy tu asistente de Inteligencia artificial .  ¿En qué puedo ayudarte hoy?</p>
        </div>
        <div id="input-container">
            <textarea id="userInput" placeholder="Escribe tu mensaje..." rows="1"></textarea>
            <button id="sendButton">Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
