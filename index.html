<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secuencias de Texto Controladas (Alexander Amaya Atehortua)</title>
    <style>
        body {
            display: flex;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a; /* Fondo oscuro */
            font-family: 'Courier New', monospace; /* Fuente de consola */
            cursor: default; /* Cursor predeterminado, ya no es clicable para iniciar */
            overflow: hidden; /* Evita barras de desplazamiento si el contenido se mueve */
            flex-direction: column; /* Added to stack content vertically */
            position: relative; /* Necesario para el posicionamiento absoluto de los hijos */
        }

        .content-wrapper {
            position: absolute; /* Posicionamiento absoluto */
            top: 15%; /* ¡AJUSTE AQUÍ! Cambiado de 10% a 15% para bajarlo. Puedes probar 20% si quieres bajarlo más. */
            left: 5%; /* Mantener el margen izquierdo */
            transform: translateY(-44%); /* Ajuste fino para centrar verticalmente, si se desea */

            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            border: none;
            background-color: transparent;
            box-shadow: none;
            border-radius: 10px;
            opacity: 0;
            width: 80%;
            max-width: 600px;
            height: 239px; /* Mantenemos la altura definida */
        }

        #typedTextContainer {
            color: #00ffff; /* Color del texto AZUL CIAN (similar a azul computadora) */
            font-size: 1.1em; /* Tamaño de fuente del texto, ajustado para el contenedor más pequeño */
            white-space: pre-wrap; /* Mantiene los saltos de línea y espacios del JS */
            word-wrap: break-word; /* Rompe palabras largas para que se ajusten al contenedor */
            opacity: 0; /* Inicialmente invisible, se maneja por JS */
            transition: opacity 1.0s ease-out; /* Duración del desvanecimiento del texto */
            line-height: 0.7; /* Altura de línea ajustada */
            text-align: left; /* Asegura la alineación a la izquierda */
            position: relative; /* Necesario para que el blinking-box se posicione dentro */
            padding-left: 20px; /* Ajustado para correr el texto a la derecha */
            height: 400%;
            width: 100%; /* Ocupa el 100% del ancho del content-wrapper */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra el texto verticalmente dentro de su contenedor */
            align-items: flex-start; /* Mantiene el texto alineado a la izquierda */
        }

        .word {
            opacity: 0;
            display: inline-block;
            transition: opacity 0.2s ease-in-out;
        }

        .blinking-box {
            position: absolute;
            width: 9px; /* Tamaño del cuadro del cursor */
            height: 9px; /* Tamaño del cuadro del cursor */
            border: 2px solid #00ffff; /* Borde del cuadro del cursor AZUL CIAN */
            background-color: #00ffff; /* Color de fondo del cuadro AZUL CIAN */
            box-shadow: 0 0 7px rgba(0, 255, 255, 0.5); /* Sombra del cuadro del cursor AZUL CIAN */
            opacity: 0; /* Inicialmente invisible */
            border-radius: 0px; /* Radio de borde */
            z-index: 10;
        }

        /* Clase para activar la animación de parpadeo del cuadro */
        .blinking-box.animate {
            animation: pause-blink-and-vanish 3.0s forwards; /* Duración de la animación del cursor */
        }

        /* Definición de la animación de parpadeo y desaparición del cuadro */
        @keyframes pause-blink-and-vanish {
            /* --- FASE DE PAUSA (3 SEGUNDOS VISIBLE) --- */
            0% { opacity: 1; }
            78.95% { opacity: 1; }

            /* --- FASE DE MUCHO MÁS PARPADEO RÁPIDO --- */
            80% { opacity: 0; }
            81% { opacity: 1; }
            82% { opacity: 0; }
            83% { opacity: 1; }
            84% { opacity: 0; }
            85% { opacity: 1; }
            86% { opacity: 0; }
            87% { opacity: 1; }
            88% { opacity: 0; }
            89% { opacity: 1; }
            90% { opacity: 0; }
            91% { opacity: 1; }
            92% { opacity: 0; }
            93% { opacity: 1; }
            94% { opacity: 0; }
            95% { opacity: 1; }
            96% { opacity: 0; }
            97% { opacity: 1; }
            98% { opacity: 0; }

            /* --- FASE DE DESAPARICIÓN TOTAL Y PERMANENTE --- */
            100% { opacity: 0; }
        }

        .additional-text {
            color: #ffffff; /* Color blanco para visibilidad */
            font-size: 1.2em;
            text-align: left;
            width: 100%;
            padding-left: 20px; /* Ajusta este valor si necesitas más margen a la izquierda */
            box-sizing: border-box;
            margin-top: 0;
            margin-bottom: -5px;
            line-height: 1.1;
        }

        p.additional-text:first-of-type {
            margin-top: 380px; /* Puedes subirlo más reduciendo este valor (ej. 20px, 2px) */
        }
    </style>
    <meta name="google-site-verification" content="-4evS4q64RV12A6GO5rp7-eVWH0D03EVj392ixPGpdo" />
</head>
<body>
    <div class="content-wrapper" id="contentWrapper">
        <div class="blinking-box" id="animatedBox"></div>
        <div id="typedTextContainer">
        </div>
    </div>

    <p class="additional-text">PAGINA EN CONSTRUCCION.</p>
    <p class="additional-text">SERVICIO TECNICO DE LLAVES</p>
    <p class="additional-text">WHATSAPP</p>
    <p class="additional-text">304-4654556</p>
    <script>
        const typedTextContainer = document.getElementById('typedTextContainer');
        const animatedBox = document.getElementById('animatedBox');
        const contentWrapper = document.getElementById('contentWrapper');
        let words = [];
        let wordIndex = 0;
        let typingInterval;
        let currentSequenceIndex = 3;

        let isSequenceRunning = false;
        let hasSequenceFinished = false;

        // --- DEFINE AQUÍ TUS SECUENCIAS DE TEXTO ---
        const textSequences = [
            "INTELIGENCIA ARTIFICAL BELLO MEDELLIN COLOMBIA EXPERIMENTA SU MAXIMA CAPACIDAD TECNOLOGICA BASADO TAMBIEN EL GRAN EJEMPLO Y SE UTILIZA LA INTELIGENCIA ARTIFICIAL EN SU MAXIMO EXPLENDOR",  "PUESTO QUE INGELIGENCIA ARTIFICIAL ESTA DESARROLLANDOSE Y POR SUPUESTO OCULAR TODO EL PUESTO, LA INTELIGENCIA ARTIFICIAL DEL 100% AL ALCANSE DE TODOS",
            "SISTEMA INICIANDO EL SERVICIO DE ASISTENCIA VIRTUAL... IDENTIDAD INTELIGENTE GRACIAS A SUS API (SERVIDOR PHYTON) )Y OPEN IA GPT LENGUAJE NATURAL",          "INTERACCIONES ATRAVES DE SU VISION ARTIFICIAL - SERVICIO INICIADO.", "BELLO ANTIOQUIA COLOMBIA IA CORPORADA AVANZADA......", "INTEGRACION DE LA,INTELIGENCIA ARTIFICIAL DESENCAPSULADA EN COLOMBIA PARA SU REDIRECCIONAMIENTO AL ENTORNO" , " INTELIGENCIA ARTIFICIAL MEDELLIN BELLO COLOMBIA 2026..."

            // Añade más secuencias aquí si lo deseas.
        ];

        // Función para preparar el texto (dividirlo en palabras y envolverlas en <span>)
        function prepareText(text) {
            typedTextContainer.innerHTML = '';
            const lines = text.split('\n');
            words = [];

            lines.forEach((line, lineIdx) => {
                const lineWords = line.split(' ');
                lineWords.forEach(wordText => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = wordText + ' ';
                    wordSpan.classList.add('word');
                    typedTextContainer.appendChild(wordSpan);
                    words.push(wordSpan);
                });
                if (lineIdx < lines.length - 1) {
                    typedTextContainer.appendChild(document.createElement('br'));
                }
            });
            typedTextContainer.style.opacity = 1;
        }

        // Función para iniciar la secuencia actual
        function startCurrentSequence() {
            isSequenceRunning = true;
            hasSequenceFinished = false;

            clearInterval(typingInterval);
            wordIndex = 0;

            const phraseToDisplay = textSequences[currentSequenceIndex];
            prepareText(phraseToDisplay);

            animatedBox.classList.remove('animate');
            animatedBox.style.opacity = 0;

            animatedBox.style.left = `${5 - (animatedBox.offsetWidth / 2)}px`;

            typingInterval = setInterval(revealNextWord, 120);
        }

        // Función para revelar la siguiente palabra y mover el cuadro
        function revealNextWord() {
            if (wordIndex < words.length) {
                const currentWordSpan = words[wordIndex];

                const contentWrapperRect = contentWrapper.getBoundingClientRect();
                const wordRect = currentWordSpan.getBoundingClientRect();
                animatedBox.style.top = `${wordRect.top - contentWrapperRect.top + (wordRect.height / 2) - (animatedBox.offsetHeight / 1.9)}px`;
                animatedBox.style.opacity = 1;

                currentWordSpan.style.opacity = 1;
                wordIndex++;
            } else {
                clearInterval(typingInterval);
                animatedBox.style.opacity = 1;

                setTimeout(() => {
                    animatedBox.classList.add('animate');
                }, 100);

                animatedBox.removeEventListener('animationend', handleBoxAnimationEnd);
                animatedBox.addEventListener('animationend', handleBoxAnimationEnd, { once: true });
            }
        }

        // Función que se ejecuta cuando la animación de parpadeo del cuadro termina
        function handleBoxAnimationEnd() {
            typedTextContainer.style.opacity = 0;

            setTimeout(() => {
                animatedBox.style.opacity = 0;
                animatedBox.classList.remove('animate');

                currentSequenceIndex++;

                if (currentSequenceIndex < textSequences.length) {
                    setTimeout(() => {
                        startCurrentSequence();
                    }, 90);
                } else {
                    console.log("Todas las secuencias han terminado. Reiniciando...");
                    isSequenceRunning = false;
                    hasSequenceFinished = true;
                    currentSequenceIndex = 0;
                    setTimeout(() => {
                        startCurrentSequence();
                    }, 800);
                }
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', () => {
             contentWrapper.style.opacity = 1;
             startCurrentSequence();
        });
    </script>
</body>
</html>
