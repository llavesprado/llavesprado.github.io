<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orión - Sistema Neuronal</title>
<style>
body {
    font-family: 'Courier New', Courier, monospace;
    background: #050505;
    color: #00ffcc;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
}
h2 {
    text-align: center;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    margin-top: 0;
}
#chat {
    flex: 1;
    border: 1px solid #00ffcc44;
    border-radius: 8px;
    padding: 15px;
    overflow-y: auto;
    background: #0a0a0f;
    box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.1);
    margin-bottom: 15px;
}
.message {
    margin-bottom: 10px;
    line-height: 1.4;
    font-size: 15px;
}
.user { color: #ff007f; text-shadow: 0 0 5px rgba(255, 0, 127, 0.4); }
.orion { color: #00ffcc; text-shadow: 0 0 5px rgba(0, 255, 204, 0.4); }

.cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background-color: #00ffcc;
    margin-left: 4px;
    vertical-align: middle;
    animation: parpadeoColor 1s infinite steps(1);
}

@keyframes parpadeoColor {
    0% { background-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    33% { background-color: #ff007f; box-shadow: 0 0 8px #ff007f; }
    66% { background-color: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
    100% { background-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
}

#controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 4px;
    border: 1px solid #00ffcc55;
    background: #111;
    color: #00ffcc;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    min-width: 180px;
    outline: none;
    box-shadow: inset 0 0 5px rgba(0,255,204,0.2);
}
input[type="text"]:focus {
    border-color: #ff007f;
    box-shadow: inset 0 0 8px rgba(255,0,127,0.4);
}
button {
    padding: 12px 18px;
    border-radius: 4px;
    border: none;
    background: linear-gradient(45deg, #00ffcc, #00d2ff);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: 0 0 10px rgba(0,255,204,0.3);
    transition: all 0.2s;
}
button:hover {
    filter: brightness(1.2);
    box-shadow: 0 0 15px rgba(0,255,204,0.6);
}
#micBtn { background: linear-gradient(45deg, #ff007f, #ff5e00); color: #fff; box-shadow: 0 0 10px rgba(255,0,127,0.3); }
#micBtn.active { background: #00ffcc; color: #000; }
#status { font-size: 11px; color: #ff007f; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

.equalizer-panel {
    display: flex;
    gap: 10px;
    background: #0e0e14;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #00ffcc33;
    width: 100%;
    box-sizing: border-box;
    align-items: center;
    justify-content: space-around;
}
.slider-group { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; gap: 2px; }
.slider-group input { cursor: pointer; width: 90px; accent-color: #00ffcc; }
</style>
</head>
<body>
<h2>ORIÓN // SISTEMA NEURONAL</h2>
<div id="status">ESTADO: CONECTANDO CON NÚCLEO...</div>
<div id="chat"></div>
<div id="controls">
<input type="text" id="userInput" placeholder="Ingresar comando...">
<button id="micBtn" onclick="toggleMic()">🎤 HABLAR</button>
<button onclick="enviarMensaje()">ENVIAR</button>
<div class="equalizer-panel">
<div class="slider-group">
<label for="speedRange">VELOCIDAD: <span id="speedVal">1.1</span>x</label>
<input type="range" id="speedRange" min="0.5" max="2.0" step="0.1" value="1.1" oninput="speedVal.innerText=this.value">
</div>
<div class="slider-group">
<label for="pitchRange">TONO: <span id="pitchVal">0.4</span></label>
<input type="range" id="pitchRange" min="0.1" max="2.0" step="0.1" value="0.4" oninput="pitchVal.innerText=this.value">
</div>
<div class="slider-group">
<label for="delayRange">BUFFER: <span id="delayVal">25</span>c</label>
<input type="range" id="delayRange" min="10" max="80" step="1" value="25" oninput="delayVal.innerText=this.value">
</div>
</div>
</div>
<script>
let ws;
const chat = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const statusDiv = document.getElementById('status');
const micBtn = document.getElementById('micBtn');
const speedRange = document.getElementById('speedRange');
const pitchRange = document.getElementById('pitchRange');
const delayRange = document.getElementById('delayRange');
let currentOrionMsg = null;
let currentCursor = null;
let recognition = null;
let isListening = false;
let textoCompletoRespuesta = "";
let textoYaHablado = "";
let selectedVoice = null;

function conectarWebSocket() {
if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
if ('speechSynthesis' in window) window.speechSynthesis.cancel();

const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
ws = new WebSocket(wsProtocol + window.location.host);

ws.onopen = () => {
statusDiv.innerText = "ESTADO: ENLACE NEURONAL ESTABLE";
ws.send(JSON.stringify({ type: "ping" }));
};

ws.onmessage = (event) => {
const data = JSON.parse(event.data);
if (data.response) {
if (!currentOrionMsg) {
currentOrionMsg = document.createElement('div');
currentOrionMsg.className = 'message orion';
currentOrionMsg.innerHTML = '<b>Orión:</b> <span class="text-content"></span><span class="cursor"></span>';
chat.appendChild(currentOrionMsg);
currentCursor = currentOrionMsg.querySelector('.cursor');
}
const textSpan = currentOrionMsg.querySelector('.text-content');
textSpan.innerText += data.response;
currentOrionMsg.appendChild(currentCursor);

textoCompletoRespuesta += data.response;
procesarStreamingVoz(false);
chat.scrollTop = chat.scrollHeight;
}
if (data.done) {
if (currentCursor) currentCursor.remove();
procesarStreamingVoz(true);
currentOrionMsg = null;
currentCursor = null;
}
};

ws.onclose = () => {
statusDiv.innerText = "ESTADO: RECONECTANDO CON ORIÓN...";
setTimeout(conectarWebSocket, 300);
};
}
conectarWebSocket();

function cargarVoces() {
if (!('speechSynthesis' in window)) return;
const voices = window.speechSynthesis.getVoices();
selectedVoice = voices.find(v => v.lang.startsWith('es') && !v.lang.includes('ES')) || voices.find(v => v.lang.startsWith('es')) || voices[0];
}
if ('speechSynthesis' in window) {
window.speechSynthesis.onvoiceschanged = cargarVoces;
cargarVoces();
}

function hablarBloqueSeguido(textoBloque) {
if (!('speechSynthesis' in window) || !textoBloque.trim()) return;
const utterance = new SpeechSynthesisUtterance(textoBloque);
if (selectedVoice) utterance.voice = selectedVoice;
utterance.lang = 'es-MX';
utterance.rate = parseFloat(speedRange.value);
utterance.pitch = parseFloat(pitchRange.value);
window.speechSynthesis.speak(utterance);
}

function procesarStreamingVoz(forzarFinal = false) {
if (!('speechSynthesis' in window)) return;
const textoPendiente = textoCompletoRespuesta.slice(textoYaHablado.length);

const indicePunto = textoPendiente.search(/[.\?!]/);
if (indicePunto !== -1) {
const bloqueHastaPunto = textoPendiente.slice(0, indicePunto + 1);
if (bloqueHastaPunto.trim().length > 0) {
hablarBloqueSeguido(bloqueHastaPunto);
textoYaHablado += bloqueHastaPunto;
}
return;
}

if (forzarFinal) {
if (textoPendiente.trim().length > 0) {
hablarBloqueSeguido(textoPendiente);
textoYaHablado += textoPendiente;
}
return;
}

const umbralBuffer = parseInt(delayRange.value);
if (textoPendiente.length >= umbralBuffer) {
let indiceCorte = textoPendiente.length;
const ultimaComa = textoPendiente.lastIndexOf(',');
const ultimoEspacio = textoPendiente.lastIndexOf(' ');
if (ultimaComa > umbralBuffer / 2) {
indiceCorte = ultimaComa + 1;
} else if (ultimoEspacio > 0) {
indiceCorte = ultimoEspacio + 1;
}
const bloqueParaHablar = textoPendiente.slice(0, indiceCorte);
if (bloqueParaHablar.trim().length > 0) {
hablarBloqueSeguido(bloqueParaHablar);
textoYaHablado += bloqueParaHablar;
}
}
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
recognition = new SpeechRecognition();
recognition.lang = 'es-ES';
recognition.continuous = false;
recognition.interimResults = false;
recognition.onresult = (event) => {
const speechToText = event.results[0][0].transcript;
userInput.value = speechToText;
statusDiv.innerText = "VOZ CAPTURADA. TRANSMITIENDO...";
enviarMensaje(speechToText);
detenerMic();
};
recognition.onerror = () => detenerMic();
recognition.onend = () => { if (isListening) detenerMic(); };
}

function toggleMic() {
if (!recognition) return alert("Reconocimiento de voz no soportado.");
if (isListening) {
recognition.stop();
detenerMic();
} else {
try {
window.speechSynthesis.cancel();
recognition.start();
isListening = true;
micBtn.classList.add('active');
micBtn.innerText = "🔴 ESCUCHANDO";
statusDiv.innerText = "ESTADO: ESCUCHANDO AUDIO...";
} catch(e) {}
}
}

function detenerMic() {
isListening = false;
micBtn.classList.remove('active');
micBtn.innerText = "🎤 HABLAR";
statusDiv.innerText = "ESTADO: ENLACE NEURONAL ESTABLE";
}

function enviarMensaje(texto) {
const textoAEnviar = texto || userInput.value.trim();
if (!textoAEnviar) return;
if (!ws || ws.readyState !== WebSocket.OPEN) {
conectarWebSocket();
setTimeout(() => enviarMensaje(textoAEnviar), 400);
return;
}
window.speechSynthesis.cancel();
textoCompletoRespuesta = "";
textoYaHablado = "";
chat.innerHTML += '<div class="message user"><b>Tú:</b> ' + textoAEnviar + '</div>';
ws.send(JSON.stringify({ prompt: textoAEnviar }));
if (!texto) userInput.value = '';
chat.scrollTop = chat.scrollHeight;
}

userInput.addEventListener('keypress', (e) => {
if (e.key === 'Enter') enviarMensaje();
});
</script>
</body>
</html>
