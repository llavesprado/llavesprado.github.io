<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Gemini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 95vh;
            background-color: #f4f4f4;
        }
        #chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 10px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #chatOutput {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
            /* Opcional: Puedes reducir el padding-bottom si quieres que el chatOutput termine más cerca del input */
            /* padding-bottom: 5px; */
        }
        #chatOutput p {
            margin: 5px 0;
            line-height: 1.5;
        }
        #chatOutput p strong {
            color: #333;
        }
        #chatOutput .thinking {
            color: #888;
            font-style: italic;
        }
        #input-container {
            display: flex;
            /* Hemos reducido el padding de 15px a 8px para acercar los elementos al borde */
            padding: 8px;
            border-top: 1px solid #eee;
            /* Opcional: Si quieres que el input-container esté aún más pegado al chatOutput,
               puedes añadir un margin-top negativo, pero ten cuidado con el diseño. */
            /* margin-top: -5px; */
        }
        #userInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
            font-size: 16px;
            resize: none; /* Evita que el usuario redimensione el textarea */
        }
        #sendButton {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 49px;
            cursor: pointer;
            font-size: 16px;
        }
        #sendButton:hover {
            background-color: #0056b3;
        }
    </style>

    <meta name="google-site-verification" content="Y07CzFRTyOVKXp3pfpySdEjCU4i8LgH95O8WwVMH7kQ" />
</head>

<body>
    <div id="chat-container">
        <div id="chatOutput">
            <p><strong>ROBOT LLAVES BELLO ANTIOQUIA:</strong> ¡Hola! Soy tu asistente de IA .  La página está en construcción, Prepárate para conocer la última, tecnología, más avazada del mundo Al alcance de todos, Democratización de la IA, Bello Antioquia Colombia Al mundo, Página en construcción...  </p>
        </div>
        <div id="input-container">
            <textarea id="userInput" placeholder="Escribe tu mensaje..." rows="1"></textarea>
            <button id="sendButton">Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
