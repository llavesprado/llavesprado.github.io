<!DOCTYPE html>
<html lang="es" style="background-color: #1a1a2e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Digital de Cerrajería - Neón Cyberpunk (V5.11 - Marquee Inferior)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Eliminamos los colores fijos de CSS y los definimos en JS para control dinámico */
        html { font-family: 'Inter', 'Orbitron', sans-serif; }
        body { background-color: transparent; } 
        /* Se ajusta ad-card ya que solo queda un elemento */
        .ad-card { transform: translateX(-150%); transition: transform 1.0s ease-out; min-height: 80px; }
        .ad-card.active { transform: translateX(0); }
        .header-animated { transform: translateX(-100%); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: inline-block; }
        .header-animated.active { transform: translateX(0); }
        
        /* El título mantiene el cian primario, pero el 'glitch' usará la variable JS (colorPrincipal) */
        .title-neon-glitch { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--color-cian-neon); /* Cian fijo */
            font-size: 2.25rem; 
            font-weight: 900; 
            text-shadow: 0 0 5px var(--color-cian-neon), 0 0 15px var(--color-cian-neon), 0 0 30px rgba(0, 240, 255, 0.8), 2px 2px 0 #005663; 
            letter-spacing: 5px; 
            animation: glitch-sutil 5s infinite linear alternate-reverse;
        }
        @media (min-width: 640px) { .title-neon-glitch { font-size: 4rem; letter-spacing: 7px; } }
        
        /* El glitch ahora usa una variable CSS que será actualizada por JS */
        @keyframes glitch-sutil { 
            0% { text-shadow: 0 0 5px var(--color-cian-neon), 0 0 15px var(--color-cian-neon); transform: translate(0, 0); } 
            5% { text-shadow: 0 0 5px var(--color-principal), 0 0 15px var(--color-principal); transform: translate(-1px, 1px); } 
            10% { text-shadow: 0 0 5px var(--color-cian-neon), 0 0 15px var(--color-cian-neon); transform: translate(1px, -1px); } 
            15% { transform: translate(0, 0); } 
            100% { transform: translate(0, 0); } 
        }
        
        /* --- CSS PRINCIPAL DEL CHATBOT CON AJUSTES DE POSICIÓN --- */
        .chatbot-container { 
            position: relative; 
            height: 280px; 
            display: flex; 
            flex-direction: column; 
            background-color: #2c2c54; 
            border-radius: 15px 15px 30px 30px; 
            overflow: hidden; 
            z-index: 1; 
            /* padding-top: para dejar espacio al robot */
            padding-top: 40px; 
            /* AJUSTE CLAVE: padding-bottom aumentado para el nuevo marquee más grande */
            padding-bottom: 30px; 
        }
        .chatbot-container header { 
            background-color: transparent; 
            border-bottom: none; 
            padding: 0; 
            flex-shrink: 0; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 40px; 
            z-index: 5; 
        }
        .ia-model-label { position: absolute; top: 5px; right: 8px; }
        #toggleVoice { position: absolute; top: 5px; left: 8px; }

        /* --- CSS PARA EL TEXTO DESLIZABLE (MARQUEE) --- */
        .marquee-container {
            display: block;
            position: absolute;
            /* AJUSTE CLAVE: Pegado al borde inferior */
            bottom: 0px; 
            left: 0;
            right: 0;
            /* AJUSTE CLAVE: Mayor altura */
            height: 30px; 
            overflow: hidden; 
            /* AJUSTE CLAVE: Color de fondo más oscuro */
            background-color: #111122; 
            /* AJUSTE CLAVE: Borde más grueso y de color morado neón */
            border-top: 2px solid #FF00FF; 
            /* AJUSTE CLAVE: z-index más alto */
            z-index: 10; 
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-family: 'Orbitron', sans-serif;
            /* AJUSTE CLAVE: Tamaño de fuente más grande */
            font-size: 0.9em; 
            font-weight: 700;
            /* AJUSTE CLAVE: Color morado neón */
            color: #FF00FF; 
            padding-left: 100%; 
            /* AJUSTE CLAVE: Sombra de texto más fuerte y morada */
            text-shadow: 0 0 5px #FF00FF, 0 0 15px rgba(255, 0, 255, 0.8); 
            animation: marquee-scroll 15s linear infinite;
            /* AJUSTE CLAVE: Centrado vertical */
            line-height: 30px; 
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); } 
        }

        /* AJUSTES DE POSICIÓN DEL ROBOT (Mantener en la parte superior) */
        .robot-head-mask { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            background-color: #1a1a2e; 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), 0 0 30px var(--color-sombra-secundaria); 
            border: 2px solid var(--color-cian-neon); 
            z-index: 8; 
        }
        
        .robot-eyes { 
            position: absolute; 
            top: 35px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 25px; 
            z-index: 10; 
        }
        .robot-eye { width: 20px; height: 45px; border-radius: 5px; animation: none; transition: none; } 
        
        /* Boca: Usa el cian neón */
        .robot-mouth {
            position: absolute; 
            top: 105px; 
            left: 50%; 
            transform: translateX(-50%) scaleY(0.5); 
            width: 50px; 
            height: 5px; 
            background-color: var(--color-cian-neon); 
            border-radius: 2px;
            box-shadow: 0 0 5px var(--color-cian-neon), 0 0 10px rgba(0, 240, 255, 0.7);
            z-index: 9; transition: transform 0.03s ease-out, box-shadow 0.03s ease-out; 
        }
        
        /* Estado PULSING ahora usa el colorPrincipal dinámico */
        .robot-eye.pulsing { background-color: var(--color-principal); animation: neon-pulse 2s infinite alternate-reverse; }
        @keyframes neon-pulse { 
            0% { box-shadow: 0 0 8px var(--color-principal), 0 0 15px var(--color-sombra-principal); } 
            100% { box-shadow: 0 0 12px var(--color-principal), 0 0 25px var(--color-sombra-principal-fuerte); } 
        }

        /* Colores de estado fijos */
        .robot-eye.speaking-eyes { background-color: #00FF00; box-shadow: 0 0 8px #00FF00, 0 0 15px rgba(0, 255, 0, 0.7); animation: neon-pulse-green 1.5s infinite alternate-reverse; }
        @keyframes neon-pulse-green { 0% { box-shadow: 0 0 8px #00FF00, 0 0 15px rgba(0, 255, 0, 0.7); } 100% { box-shadow: 0 0 12px #00FF00, 0 0 25px rgba(0, 255, 0, 1); } }
        .robot-eye.alert { background-color: #FF0000; box-shadow: 0 0 10px #FF0000, 0 0 20px rgba(255, 0, 0, 0.8); animation: neon-pulse 0.5s infinite alternate-reverse; }
        .robot-eye.info { background-color: #00BFFF; box-shadow: 0 0 10px #00BFFF, 0 0 20px rgba(0, 191, 255, 0.8); animation: none; }
        .robot-eye.processing { background-color: #00f0ff; box-shadow: 0 0 10px #00f0ff, 0 0 20px rgba(0, 240, 255, 0.8); animation: processing-flicker 0.1s infinite alternate; }
        .robot-eye.warning { background-color: #00f0ff; box-shadow: 0 0 10px #00f0ff, 0 0 20px rgba(0, 240, 255, 0.8); animation: detail-flicker 2s infinite step-end; }
        @keyframes detail-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        @keyframes processing-flicker { 0% { opacity: 1; } 100% { opacity: 0.8; } }
        .robot-eye.blink { transform: scaleY(0.1) !important; box-shadow: none !important; transition: transform 0.05s ease-out !important; animation: none !important; }
        
        /* Visemas usan el cian fijo */
        .robot-mouth.visema-A { transform: translateX(-50%) scaleY(6.5) scaleX(1.4); box-shadow: 0 0 16px var(--color-cian-neon), 0 0 32px rgba(0, 240, 255, 1); } 
        .robot-mouth.visema-E { transform: translateX(-50%) scaleY(4.5) scaleX(1.1); box-shadow: 0 0 13px var(--color-cian-neon), 0 0 26px rgba(0, 240, 255, 0.9); } 
        .robot-mouth.visema-I { transform: translateX(-50%) scaleY(2.0) scaleX(0.7); box-shadow: 0 0 9px var(--color-cian-neon), 0 0 18px rgba(0, 240, 255, 0.7); } 
        .robot-mouth.visema-O { transform: translateX(-50%) scaleY(5.5) scaleX(1.2); box-shadow: 0 0 15px var(--color-cian-neon), 0 0 30px rgba(0, 240, 255, 1); } 
        .robot-mouth.visema-U { transform: translateX(-50%) scaleY(5.0) scaleX(1.0); box-shadow: 0 0 14px var(--color-cian-neon), 0 0 28px rgba(0, 240, 255, 0.95); } 
        .robot-mouth.visema-closed { transform: translateX(-50%) scaleY(0.5) scaleX(1.0); box-shadow: 0 0 5px var(--color-cian-neon), 0 0 10px rgba(0, 240, 255, 0.7); } 
        .robot-mouth.visema-neutral { transform: translateX(-50%) scaleY(2.5) scaleX(1.1); box-shadow: 0 0 7px var(--color-cian-neon), 0 0 14px rgba(0, 240, 255, 0.6); } 
        .robot-mouth.visema-silence { transform: translateX(-50%) scaleY(0.2) scaleX(0.8); box-shadow: 0 0 3px var(--color-cian-neon); } 
        
        .chat-box { 
            flex-grow: 1; 
            padding: 8px; 
            /* Eliminar padding-bottom para que el chat use todo el espacio */
            padding-bottom: 0px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            box-sizing: border-box; 
            background-color: transparent; 
        }
        .input-container { display: flex; padding: 8px; border-top: none; flex-shrink: 0; }
        .message { padding: 6px 10px; border-radius: 12px; max-width: 85%; font-size: 0.8em; }
        .user-message { align-self: flex-end; background-color: #4a90e2; color: white; }
        .bot-message { align-self: flex-start; background-color: #3f3f6e; color: var(--color-cian-neon); border: 1px solid var(--color-cian-neon);} 
        #userInput { flex-grow: 1; padding: 6px; border-radius: 15px; font-size: 0.85em; background-color: #3f3f6e; color: var(--color-cian-neon); border: 1px solid var(--color-cian-neon); }
        
        /* Botones y micrófono usan la variable CSS del color principal */
        #micButton { flex-shrink: 0; background-color: var(--color-principal); color: #1a1a2e; padding: 6px 8px; }
        #micButton.listening { background-color: #f5a623; }
        .action-buttons button { flex-shrink: 0; background-color: var(--color-principal); color: #1a1a2e; font-weight: bold; border-radius: 15px; padding: 6px 10px; margin-left: 5px; cursor: pointer; border: none; }
        .action-buttons button:hover { opacity: 0.8; }
        
    </style>
</head>
<body class="min-h-screen p-2"> 

    <div class="max-w-4xl mx-auto">
        
        <header id="header-title" class="mb-6 overflow-hidden text-center">
            <h1 id="animated-title" class="header-animated title-neon-glitch tracking-tight">
                🔑 <span id="interactive-service-text">Servicio Técnico</span> de Cerrajería Llaves, para Casa, Auto o Moto
            </h1>
        </header>

        <section id="ads-container" class="space-y-3">
            
            <div id="ad-3-chatbot" class="ad-card rounded-xl shadow-2xl p-2 border-l-4 border-cyan-500">
                <div class="chatbot-container">
                    
                    <div class="robot-head-mask"></div>
                    
                    <div class="robot-eyes">
                        <div id="robot-eye-left" class="robot-eye"></div>
                        <div id="robot-eye-right" class="robot-eye"></div>
                    </div>
                    <div id="robot-mouth" class="robot-mouth visema-silence"></div> 
                    
                    <header>
                        <div class="ia-model-label">Powered by Gemini Logic</div>
                        <button id="toggleVoice" onclick="toggleVoiceOutput()">🔊 Voz: ON</button>
                    </header>
            
                    <div class="chat-box" id="chatBox">
                        <div class="message bot-message"></div>
                    </div>
            
                    <div id="development-marquee" class="marquee-container">
                        <span class="marquee-text">
                            *** CHATBOT EN DESARROLLO *** // PRÓXIMAMENTE MÁS FUNCIONES // *** CHATBOT EN DESARROLLO *** </span>
                    </div>
                    <div class="input-container">
                        <input type="text" id="userInput" placeholder="Pregúntale a Gemini-Bot sobre cerrajería..." autofocus>
                        <div class="action-buttons">
                            <button id="micButton" onclick="iniciarReconocimiento()">🎙️</button>
                            <button onclick="enviarMensaje()">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
            
        </section>

    </div>

    <script>
        // --- CONSTANTES DE DATOS ---
        const NUMERO_MOVIL = "304 465 4556";
        const NUMERO_FIJO = "604 598 1532";
        const UBICACION_LLAVES_CASA = "Carrera 51 #55-57, cerca de donde estaba la antigua Plaza de Bello";
        const TELEFONO_LLAVES_CASA = "301 325 9050";

        // --- PALETA DE COLORES DE LA IA ---
        const COLOR_PALETTE = [
            '#00FFFF', // Cian (el más común)
            '#00BFFF', // Azul oscuro (el último solicitado)
            '#00FF88', // Verde (alternativa)
            '#33CCCC'  // Cian más suave
        ];
        const CIAN_NEON_FIJO = '#00f0ff'; // Usado para el título y el borde del bot
        let colorIndex = 0;
        let rootStyle;

        // Función para cambiar el color principal
        function setMainColor(colorHex) {
            // Generar un color de sombra semi-transparente para el efecto neón
            const r = parseInt(colorHex.substring(1, 3), 16);
            const g = parseInt(colorHex.substring(3, 5), 16);
            const b = parseInt(colorHex.substring(5, 7), 16);
            
            const rgbaFuerte = `rgba(${r}, ${g}, ${b}, 1.0)`;
            const rgbaSuave = `rgba(${r}, ${g}, ${b}, 0.7)`;

            rootStyle.setProperty('--color-principal', colorHex);
            rootStyle.setProperty('--color-sombra-principal', rgbaSuave);
            rootStyle.setProperty('--color-sombra-principal-fuerte', rgbaFuerte);
            
            document.getElementById('micButton').style.backgroundColor = colorHex;
            
            // Asegurar que el botón "Enviar" también use el color
            const sendButton = document.querySelector('.action-buttons button:last-child');
            if (sendButton) {
                sendButton.style.backgroundColor = colorHex;
            }
        }
        
        /**
         * Ciclo de colores para simular una IA "pensante"
         */
        function cycleColors() {
            colorIndex = (colorIndex + 1) % COLOR_PALETTE.length;
            setMainColor(COLOR_PALETTE[colorIndex]);
            
            // Ciclo cada 8 segundos
            setTimeout(cycleColors, 8000); 
        }

        // --- VARIABLES GLOBALES PARA CONTROL DEL ROBOT ---
        let isTyping = false;     
        let isProcessing = false; 
        let isListening = false;
        let eyeLeft, eyeRight, mouth;
        let visemaTimeout; 
        
        const getDomElements = () => {
            eyeLeft = document.getElementById('robot-eye-left');
            eyeRight = document.getElementById('robot-eye-right');
            mouth = document.getElementById('robot-mouth');
            rootStyle = document.documentElement.style;
            
            // Inicializar las variables CSS estáticas que no cambian en el ciclo
            rootStyle.setProperty('--color-cian-neon', CIAN_NEON_FIJO); 
            rootStyle.setProperty('--color-sombra-secundaria', 'rgba(255, 0, 255, 0.4)'); // Sombra morada para el contraste
        };

        // --- LÓGICA DE VISEMAS MEJORADA PARA EL ESPAÑOL ---
        
        const VISEMA_MAP = {
            'A': 'visema-A', 'E': 'visema-E', 'I': 'visema-I',  
            'O': 'visema-O', 'U': 'visema-U',
            'closed': 'visema-closed', 'neutral': 'visema-neutral', 
            'silence': 'visema-silence'  
        };
        
        // Mapeo refinado de letras/grupos/NÚMEROS a visemas en Español
        const VISEMA_GROUPS = {
            'A': 'A', 'E': 'E', 'I': 'I', 'O': 'O', 'U': 'U',
            'M': 'closed', 'P': 'closed', 'B': 'closed',
            'F': 'closed', 'V': 'closed', 'W': 'closed', 
            'T': 'I', 'D': 'I', 'S': 'I', 'Z': 'I', 
            'L': 'neutral', 'N': 'neutral', 
            'R': 'U', 'RR': 'U', 
            'Ñ': 'neutral', 'Y': 'neutral', 'LL': 'neutral',
            'C': 'E', 'Q': 'E', 'K': 'E', 'G': 'E', 
            'J': 'A', 'H': 'A', 'X': 'neutral', 
            'CH': 'neutral',

            // VISEMAS PARA NÚMEROS (Fonética en Español)
            '0': 'O', '1': 'I', '2': 'U', '3': 'E', '4': 'A', 
            '5': 'I', '6': 'E', '7': 'E', '8': 'O', '9': 'E'  
        };
        
        // Duraciones de pausas (AJUSTADAS A 20MS)
        const PAUSE_DURATIONS = {
            ' ': 20,    // Espacio: 20ms (Pausa mínima perceptible)
            ',': 20,    // Coma: 20ms
            '.': 20,    // Punto/Fin de frase: 20ms
            '?': 20,   
            '!': 20,   
            ';': 20,   
            ':': 20    
        };
        const PUNCTUATION_REGEX = /[.,?!;:]/g;


        // --- SIMULACIÓN AVANZADA DE VISEMAS (Movimiento de Boca) ---
        function simulateVisemes(text, rate = 1.0) {
            window.clearTimeout(visemaTimeout);
            
            if (window.speechSynthesis.speaking === false || !isVoiceActive) {
                 mouth.className = 'robot-mouth visema-silence';
                 return;
            }

            // 1. Normalizar y limpiar texto y buscar grupos fonéticos.
            let cleanedText = normalizarParaComparar(text).toUpperCase();
            
            cleanedText = cleanedText
                .replace(/RR/g, '{RR}')
                .replace(/LL/g, '{LL}')
                .replace(/CH/g, '{CH}');

            // 2. Insertar marcadores de pausa y limpiar
            cleanedText = cleanedText
                .replace(PUNCTUATION_REGEX, (match) => ` ${match} `)
                .replace(/[^A-Z0-9{}\sÑ,.]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
                
            let sequence = [];
            const tokens = cleanedText.split(''); 

            // 3. Generar la secuencia de visemas y duraciones
            for (let i = 0; i < tokens.length; i++) {
                const char = tokens[i];
                let visemaType;
                let durationOverride = null;

                if (PAUSE_DURATIONS.hasOwnProperty(char)) {
                    visemaType = 'silence';
                    durationOverride = PAUSE_DURATIONS[char];
                } else {
                    if (char.startsWith('{') && char.endsWith('}')) {
                        const marker = char.slice(1, -1); 
                        visemaType = VISEMA_GROUPS[marker] || 'neutral';
                    } else {
                        visemaType = VISEMA_GROUPS[char] || 'neutral';
                    }
                }
                
                if (visemaType) {
                    sequence.push({ 
                        type: visemaType, 
                        duration: durationOverride 
                    });
                }
            }

            let index = 0;
            const animateNextVisema = () => {
                if (window.speechSynthesis.speaking === false || index >= sequence.length || !isVoiceActive) {
                    window.clearTimeout(visemaTimeout); 
                    mouth.className = 'robot-mouth visema-silence';
                    if (mouth.style.transitionDuration !== '0.03s') { 
                        mouth.style.transitionDuration = '0.03s';
                    }
                    return;
                }

                const item = sequence[index];
                const className = VISEMA_MAP[item.type];
                
                if (mouth.className !== `robot-mouth ${className}`) {
                    mouth.className = `robot-mouth ${className}`;
                }

                index++;

                // Calcular la duración:
                let duration;
                if (item.duration !== null) {
                    duration = item.duration; 
                } else {
                    // Duración base: 60ms
                    const baseDuration = 60; 
                    const variation = (Math.random() * 6 - 3); 
                    
                    // CLAVE: Aplicar la inversa del 'rate' para acelerar/ralentizar la animación.
                    duration = (baseDuration / rate) + variation; 

                    if (duration < 20) duration = 20; 
                }
                
                visemaTimeout = window.setTimeout(animateNextVisema, duration);
            };
            
            // Llamar a la función de animación inmediatamente para la mejor sincronización
            animateNextVisema(); 
        }

        // --- FUNCIONES AUXILIARES DE ANIMACIÓN (Ojos) ---
        
        const blink = (eye) => {
            eye.classList.add('blink');
            setTimeout(() => { eye.classList.remove('blink'); }, 200); 
        };

        /**
         * Parpadeo autónomo basado en probabilidad para simular comportamiento natural.
         */
        function startEyeBlinking() {
            if (!eyeLeft || !eyeRight) { 
                setTimeout(startEyeBlinking, 100); // Intenta de nuevo si aún no están listos
                return;
            }

            // Lógica de Estado: El parpadeo solo ocurre si el robot está inactivo o pulsando.
            const isVisualFocus = eyeLeft.className.includes('alert') || eyeLeft.className.includes('info') || eyeLeft.className.includes('warning') || eyeLeft.className.includes('detail');
            
            // Si está ocupado (hablando, procesando, etc.), NO parpadea.
            const isBusy = isTyping || isProcessing || isListening || window.speechSynthesis.speaking || isVisualFocus; 

            let nextBlinkTime = 0;
            
            if (isBusy) {
                // Si está ocupado, espera un tiempo más corto para reevaluar.
                nextBlinkTime = 500; 
            } else {
                // Probabilidad aumentada para un parpadeo más seguido (0.35)
                const randomChance = Math.random();
                
                if (randomChance < 0.35) { 
                    blink(eyeLeft);
                    blink(eyeRight);
                    // Intervalo corto (0.2s - 0.8s)
                    nextBlinkTime = Math.random() * 600 + 200; 
                } else {
                    // Intervalo de espera más largo (0.5s - 2s)
                    nextBlinkTime = Math.random() * 1500 + 500; 
                }
            }
            
            // Re-ejecutar la función con el nuevo temporizador
            setTimeout(startEyeBlinking, nextBlinkTime);
        }

        const startEyeMovement = () => {
            const userInput = document.getElementById('userInput');
            if (!eyeLeft || !eyeRight || !userInput) { return; }
            
            userInput.addEventListener('focus', () => {
                isTyping = true; 
                eyeLeft.className = 'robot-eye info'; 
                eyeRight.className = 'robot-eye info';
                mouth.className = 'robot-mouth visema-silence'; 
                window.clearTimeout(visemaTimeout); 
                window.speechSynthesis.cancel();
            });
            
            userInput.addEventListener('blur', () => {
                isTyping = false; 
                if (!window.speechSynthesis.speaking && !isProcessing && !isListening) {
                    eyeLeft.className = 'robot-eye pulsing';
                    eyeRight.className = 'robot-eye pulsing';
                    mouth.className = 'robot-mouth visema-silence';
                }
            });
        };

        // --- FUNCIÓN PRINCIPAL DE HABLA y SINCRONIZACIÓN DE OJOS ---
        
        function estimateSpeechDuration(text, rate) {
            const charCount = text.length;
            let duration = (charCount * 60 / rate); 
            
            duration += text.split(' ').length * 20; 
            duration += (text.match(/[.,?!]/g) || []).length * 100; 

            return Math.max(duration, 1000); 
        }

        const syncMouthAndEyes = (utterance, text, tone) => {
            if (!mouth || !eyeLeft || !eyeRight) return;
            
            let eyeClass = 'speaking-eyes'; 
            let speechRate = 1.0; 
            let speechDuration = 0; 

            if (tone === 'EMERGENCIA') {
                eyeClass = 'alert';
                speechRate = 1.1; 
            } else if (tone === 'LOGÍSTICA') {
                eyeClass = 'info';
                speechRate = 0.9; 
            } else if (tone === 'ADVERTENCIA') {
                // CAMBIO: Usa el color "computarizado" (cian) para advertencia
                eyeClass = 'warning'; 
                speechRate = 1.0;
            } else if (text.split(/\s+/).length > 25) { 
                eyeClass = 'detail';
                speechRate = 0.95; 
            } else if (tone === 'NEUTRO') {
                eyeClass = 'speaking-eyes';
                speechRate = 1.0;
            }
            
            speechDuration = estimateSpeechDuration(text, speechRate);
            eyeLeft.className = 'robot-eye ' + eyeClass;
            eyeRight.className = 'robot-eye ' + eyeClass;
            utterance.rate = speechRate; 
            
            const resetAnimations = () => {
                window.clearTimeout(visemaTimeout); 
                
                mouth.className = 'robot-mouth visema-silence'; 
                setTimeout(() => {
                    if (mouth) mouth.style.transitionDuration = '0.03s'; 
                }, 10); 
                
                eyeLeft.className = 'robot-eye pulsing';
                eyeRight.className = 'robot-eye pulsing';
            };


            utterance.onstart = () => { 
                mouth.style.transitionDuration = '0s'; 
                simulateVisemes(text, speechRate); 
                
                setTimeout(resetAnimations, speechDuration);
            };
            
            utterance.onend = resetAnimations;
            utterance.onerror = utterance.oncancel = resetAnimations; 
        }
        
        // --- LÓGICA DE VOZ, ESCUCHA y BASE DE CONOCIMIENTO ---
        const synth = window.speechSynthesis;
        let isVoiceActive = true; 
        let voices = []; 
        let speechEnabled = ('speechSynthesis' in window); 
        let spanishVoice = null; 

        function populateVoiceList() { 
            voices = speechSynthesis.getVoices(); 
            spanishVoice = voices.find(voice => 
                voice.lang.startsWith('es-ES') || 
                voice.lang.startsWith('es-MX') || 
                voice.lang.startsWith('es')
            );
            
            if (!spanishVoice && voices.length > 0) {
                 spanishVoice = voices[0];
            }
            
        }
        if (speechEnabled) { populateVoiceList(); speechSynthesis.onvoiceschanged = populateVoiceList; }
        
        const hablar = (texto, tone) => {
            if (!isVoiceActive) {
                eyeLeft.className = 'robot-eye pulsing';
                eyeRight.className = 'robot-eye pulsing';
                mouth.className = 'robot-mouth visema-silence';
                return;
            }
            
            window.speechSynthesis.cancel(); 
            window.clearTimeout(visemaTimeout);
            synth.cancel(); 
            
            const textoLimpio = texto.replace(/\*\*/g, '');

            // Reemplazo con comas para forzar la lectura dígito por dígito para mejor sincronización.
            let textoParaTTS = textoLimpio.replace(NUMERO_MOVIL, '3, 0, 4, 4, 6, 5, 4, 5, 5, 6'); 
            textoParaTTS = textoParaTTS.replace(NUMERO_FIJO, '6, 0, 4, 5, 9, 8, 1, 5, 3, 2'); 
            textoParaTTS = textoParaTTS.replace(TELEFONO_LLAVES_CASA, '3, 0, 1, 3, 2, 5, 9, 0, 5, 0'); 

            const utterance = new SpeechSynthesisUtterance(textoParaTTS); 
            
            if (spanishVoice) {
                utterance.voice = spanishVoice;
                utterance.lang = spanishVoice.lang; 
            } else {
                utterance.lang = 'es-ES'; 
            }

            syncMouthAndEyes(utterance, textoLimpio, tone); 
            utterance.pitch = 1.0; 
            synth.speak(utterance);
        };
        
        function toggleVoiceOutput() {
            const button = document.getElementById('toggleVoice');
            isVoiceActive = !isVoiceActive;
            
            window.speechSynthesis.cancel(); 
            window.clearTimeout(visemaTimeout);
            synth.cancel(); 

            if(mouth) {
                mouth.style.transitionDuration = '0.03s'; 
                mouth.className = 'robot-mouth visema-silence'; 
            }
            if(eyeLeft) eyeLeft.className = 'robot-eye pulsing'; 
            if(eyeRight) eyeRight.className = 'robot-eye pulsing';

            if (isVoiceActive) {
                button.textContent = '🔊 Voz: ON';
                button.style.backgroundColor = 'transparent'; 
                hablar("Voz activada.", 'NEUTRO'); 
            } else {
                button.textContent = '🔇 Voz: OFF';
                button.style.backgroundColor = '#d32f2f'; 
            }
        }
        
        // --- Lógica de Reconocimiento de Voz ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        const micButton = document.getElementById('micButton');
        let recognitionEnabled = false; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognitionEnabled = true; 

            recognition.onstart = () => { 
                isListening = true; 
                micButton.classList.add('listening'); 
                micButton.textContent = '🔴'; 
                document.getElementById('userInput').placeholder = "Escuchando..."; 
                // CAMBIO: usa el color "computarizado" (cian) para processing
                eyeLeft.className = 'robot-eye processing'; 
                eyeRight.className = 'robot-eye processing';
                
                if(mouth) mouth.style.transitionDuration = '0.03s';
                mouth.className = 'robot-mouth visema-silence'; 
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                recognition.onend(); 
                enviarMensaje(); 
            };
            recognition.onend = () => { 
                isListening = false; 
                micButton.classList.remove('listening'); 
                micButton.textContent = '🎙️'; 
                document.getElementById('userInput').placeholder = "Pregúntale a Gemini-Bot sobre cerrajería..."; 
                
                if(mouth) mouth.style.transitionDuration = '0.03s';
                mouth.className = 'robot-mouth visema-silence'; 
            };
            recognition.onerror = (event) => { 
                console.error('Error de voz:', event.error); 
                recognition.onend(); 
            };
        } else {
             if(micButton) micButton.style.display = 'none'; 
        }

        function iniciarReconocimiento() {
            if (recognition && recognitionEnabled) {
                window.speechSynthesis.cancel(); 
                window.clearTimeout(visemaTimeout);
                
                if (isListening) { 
                    recognition.stop(); 
                } else { 
                    recognition.start(); 
                }
            } else {
                 mostrarMensaje("La función de dictado por voz no está disponible.", 'bot-message');
            }
        }
        
        // --- LÓGICA DE RESPUESTAS (Base de Conocimiento) ---
        const quitarTildes = (texto) => texto.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
        const normalizarParaComparar = (str) => quitarTildes(str).toLowerCase().trim();

        function obtenerRespuesta(userText) {
            // Lógica modificada para responder SIEMPRE "Estoy en construcción"
            return { respuesta: "Estoy en construcción.", tono: 'NEUTRO' };
        }

        // --- LÓGICA DE INTERFAZ Y CONTROL DE MENSAJES ---
        function enviarMensaje() {
            const userInput = document.getElementById('userInput');
            const userText = userInput.value;
            
            if (!userText.trim()) return;
            
            window.speechSynthesis.cancel(); 
            window.clearTimeout(visemaTimeout);
            
            // 1. Mostrar el mensaje del usuario
            mostrarMensaje(userText, 'user-message');
            userInput.value = '';
            
            // 2. Iniciar procesamiento (Ojos: "computarizado" - cian)
            isProcessing = true;
            eyeLeft.className = 'robot-eye processing';
            eyeRight.className = 'robot-eye processing';
            
            if(mouth) mouth.style.transitionDuration = '0.03s'; 
            mouth.className = 'robot-mouth visema-silence'; 

            // 3. Simular tiempo de respuesta (500ms)
            setTimeout(() => {
                const responseData = obtenerRespuesta(userText);
                
                // Mostrar la respuesta del bot en el chat box
                mostrarMensaje(responseData.respuesta, 'bot-message'); 
                
                // 4. Hablar la respuesta y activar la sincronización
                hablar(responseData.respuesta, responseData.tono); 
                
                // 5. Detener procesamiento (onend del habla o !isVoiceActive se encargan de reestablecer ojos/boca)
                isProcessing = false;
                
                if (!isVoiceActive) {
                    // Si la voz está apagada, restablecer inmediatamente los ojos y la boca
                    eyeLeft.className = 'robot-eye pulsing';
                    eyeRight.className = 'robot-eye pulsing';
                    
                    if(mouth) mouth.style.transitionDuration = '0.03s';
                    mouth.className = 'robot-mouth visema-silence';
                }
            }, 500);
        }

        function mostrarMensaje(mensaje, tipo) {
            const chatBox = document.getElementById('chatBox');
            
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', tipo);
            
            // *** MANTENER MODIFICACIÓN CLAVE AQUÍ: No renderizar texto del bot ***
            if (tipo === 'bot-message') {
                // El texto del bot está vacío para simular una respuesta no visible
                messageElement.innerHTML = ''; 
                messageElement.style.minHeight = '1.2em'; 
            } else {
                // Renderizar negritas para los mensajes del usuario
                mensaje.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
            }
            
            chatBox.appendChild(messageElement);

            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 100);
        }

        // Eventos de usuario
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        });

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            getDomElements(); 
            
            // 1. Inicializar el ciclo de colores
            cycleColors(); 

            // 2. Animación de entrada de tarjetas
            document.getElementById('animated-title').classList.add('active'); 
            // Solo queda la tarjeta del chatbot para animar
            const chatbotCard = document.getElementById('ad-3-chatbot');
            
            setTimeout(() => { 
                chatbotCard.classList.add('active'); 
            }, 900); // Se mantiene el primer delay para la animación

            // 3. Lógica del robot después de la animación
            setTimeout(() => { 
                if(eyeLeft && eyeRight) {
                    eyeLeft.className = 'robot-eye pulsing'; 
                    eyeRight.className = 'robot-eye pulsing';
                    mouth.className = 'robot-mouth visema-silence'; 
                    startEyeMovement(); 
                    startEyeBlinking(); // Asegura que el parpadeo inicie
                }
            }, 1000); 

        });
    </script>
</body>
