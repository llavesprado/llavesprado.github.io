<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orión: Llaves Prado</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
        }
        #instruction {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            padding: 0 10px;
            box-sizing: border-box;
        }
        #instruction span {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 12px #00ffff;
            border-radius: 20px;
            padding: 10px 18px;
            display: inline-block;
        }
        #qr-container {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ffff;
            box-shadow: 0 0 18px #00ffff;
            border-radius: 16px;
            padding: 12px 16px;
            z-index: 20;
            text-align: center;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        #qr-container img {
            width: 150px;
            height: 150px;
            display: block;
            border-radius: 8px;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .qr-marquee-container {
            width: 150px;
            overflow: hidden;
            white-space: nowrap;
            margin: 6px 0 0 0;
            background: rgba(0, 10, 20, 0.6);
            border-radius: 6px;
            padding: 3px 0;
            box-sizing: border-box;
        }
        .qr-marquee {
            display: inline-block;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7);
            letter-spacing: 0.5px;
            animation: scroll-qr 8s linear infinite;
        }
        @keyframes scroll-qr {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        @media (max-width: 768px) {
            #instruction { font-size: 15px; }
            #instruction span { padding: 6px 12px; }
            #qr-container {
                top: 85px;
                padding: 10px 12px;
            }
            #qr-container img {
                width: 110px;
                height: 110px;
            }
            .qr-marquee-container {
                width: 110px;
            }
            .qr-marquee {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div id="instruction"><span id="instruction-text"></span></div>

    <div id="qr-container">
        <img src="avisoelqr.png" alt="Código QR WhatsApp">
        <div class="qr-marquee-container">
            <span class="qr-marquee">ESCANEA AQUÍ EL CÓDIGO QR PARA ENTRAR A LA PÁGINA WEB &nbsp;&nbsp;&nbsp;&nbsp;</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const esMovil = window.innerWidth <= 768;

        const textoAndroid = "Toca la pantalla táctil para interactuar con los servicios. - Bello Antioquia, Copyright 2026 \u00A9";
        const textoPC = "Dale clic con el ratón del mouse a los párrafos para llegar al destino. - Bello Antioquia, Copyright 2026 \u00A9";

        document.getElementById('instruction-text').innerText = esMovil ? textoAndroid : textoPC;

        const configOriginal = {
            llaveX: esMovil ? -1.5 : -2.0,       
            llaveYInicio: 0,
            llaveEscala: esMovil ? 0.28 : 0.38,
            scrollerX: esMovil ? 0.50 : 0.8,    
            scrollerInicioX: 6.5,               
            scrollerAncho: esMovil ? 2.3 : 3.4,
            scrollerAlto: esMovil ? 0.50 : 0.85,
            espaciadoY: esMovil ? 0.60 : 0.8
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccess() {
            [440, 660].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.1));
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.1) + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (i * 0.1));
                osc.stop(audioCtx.currentTime + (i * 0.1) + 0.2);
            });
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const starCount = 1200;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSpeeds = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 60;
            starSpeeds[i] = 0.05 + Math.random() * 0.15;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        const group = new THREE.Group();
        scene.add(group);

        const shape = new THREE.Shape();
        shape.moveTo(0, 1.8); shape.lineTo(0.7, 1.5); shape.lineTo(0.9, 0.9);
        shape.lineTo(0.7, 0.4); shape.lineTo(0.20, 0.1); 
        shape.lineTo(0.38, -0.1); shape.lineTo(0.20, -0.3);
        shape.lineTo(0.38, -0.5); shape.lineTo(0.20, -0.7);
        shape.lineTo(0.38, -0.9); shape.lineTo(0.20, -1.1);
        shape.lineTo(0.38, -1.3); shape.lineTo(0.20, -1.5);
        shape.lineTo(0.38, -1.7); shape.lineTo(0, -2.1); 
        shape.lineTo(-0.20, -1.7); shape.lineTo(-0.20, 0.1);
        shape.lineTo(-0.7, 0.4); shape.lineTo(-0.9, 0.9); 
        shape.lineTo(-0.7, 1.5); shape.lineTo(0, 1.8);
        shape.closePath();

        const hole = new THREE.Path();
        const r = 0.22; const cy = 1.05;
        hole.moveTo(r, cy); hole.lineTo(r * 0.707, cy + r * 0.707);
        hole.lineTo(0, cy + r); hole.lineTo(-r * 0.707, cy + r * 0.707);
        hole.lineTo(-r, cy); hole.lineTo(-r * 0.707, cy - r * 0.707);
        hole.lineTo(0, cy - r); hole.lineTo(r * 0.707, cy - r * 0.707);
        shape.holes.push(hole);

        const lineLeft = new THREE.Path();
        lineLeft.moveTo(-0.08, 0.05); lineLeft.lineTo(-0.08, -1.6);
        lineLeft.lineTo(-0.02, -1.6); lineLeft.lineTo(-0.02, 0.05);
        shape.holes.push(lineLeft);

        const lineRight = new THREE.Path();
        lineRight.moveTo(0.08, 0.05); lineRight.lineTo(0.08, -1.6);
        lineRight.lineTo(0.02, -1.6); lineRight.lineTo(0.02, 0.05);
        shape.holes.push(lineRight);

        const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05 });
        const keyMaterial = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2, emissive: 0x000000 });
        const key = new THREE.Mesh(geom, keyMaterial);
        key.geometry.center();
        group.add(key);

        function createServiceText(zPos, rotationY) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.font = 'bold 100px Arial';
            ctx.fillText('Servicio Tecnico', 512, 500);
            ctx.fillText('3044654556', 512, 600);

            const texture = new THREE.CanvasTexture(canvas);
            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, 
                depthTest: false 
            }));
            textMesh.renderOrder = 1;
            textMesh.position.set(0, 0.65, zPos);
            textMesh.rotation.y = rotationY;
            return textMesh;
        }
        group.add(createServiceText(0.26, 0));
        group.add(createServiceText(-0.26, Math.PI));

        const scrollers = [];
        const scrollerMessages = ['APERTURAS DE PUERTAS', 'PARA CARRO Y CASA', 'CAMBIO DE CLAVES', '304 465 45 56'];
        const imgLoader = new THREE.TextureLoader();
        const waLogo = imgLoader.load('https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg');

        function createScroller(yPos, text) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; 
            canvas.height = 512; 
            const ctx = canvas.getContext('2d');
            ctx.textAlign = 'left';

            if (text === '304 465 45 56') {
                ctx.beginPath();
                ctx.roundRect(20, 15, 1500, 480, 100); 
                ctx.fillStyle = 'rgba(0, 20, 40, 0.85)';
                ctx.fill();
                ctx.lineWidth = 14;
                ctx.strokeStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 35;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 170px Arial';
                ctx.fillText(text, 70, 165);

                const logoSize = 175; 
                if (waLogo.image) ctx.drawImage(waLogo.image, 70, 220, logoSize, logoSize);

                ctx.font = '900 210px Arial'; 
                ctx.fillText('WhatsApp', 270, 360);
                ctx.font = '900 120px Arial';
                ctx.fillText('haz clic aquí', 270, 465);
            } else {
                ctx.font = '900 150px Arial';
                const textWidth = ctx.measureText(text).width;
                
                ctx.beginPath();
                ctx.roundRect(20, 110, textWidth + 120, 260, 120);
                ctx.fillStyle = 'rgba(0, 20, 40, 0.85)';
                ctx.fill();
                ctx.lineWidth = 12;
                ctx.strokeStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 30;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(text, 80, 284);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(configOriginal.scrollerAncho, configOriginal.scrollerAlto), 
                new THREE.MeshBasicMaterial({ map: texture, transparent: true })
            );
            mesh.position.set(configOriginal.scrollerInicioX, yPos, 0); 
            mesh.userData.stopTime = null; 
            scene.add(mesh);
            return mesh;
        }

        const clock = new THREE.Clock();
        const targetPos = new THREE.Vector3(configOriginal.llaveX, esMovil ? -0.1 : 1.2, 0); 
        const targetScale = new THREE.Vector3(configOriginal.llaveEscala, configOriginal.llaveEscala, configOriginal.llaveEscala);
        let moveStarted = false;
        let firstScrollerSpawned = false;
        let clickCount = 0;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleInteraction(clientX, clientY) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scrollers);
            
            if (intersects.length > 0 && scrollers.indexOf(intersects[0].object) === 3) {
                playSuccess();
                setTimeout(() => {
                    let toggle = 0;
                    const blink = setInterval(() => {
                        key.visible = !key.visible;
                        key.material.emissive.set(Math.random() * 0xffffff);
                        key.material.emissiveIntensity = toggle % 2 === 0 ? 10 : 0;
                        toggle++;
                    }, 5);
                    setTimeout(() => {
                        clearInterval(blink);
                        key.visible = true;
                        key.material.emissiveIntensity = 0;
                        window.open('https://wa.me/573044654556', '_self');
                    }, 50);
                }, 20);
                return;
            }
            
            if (moveStarted) {
                if (clickCount < 3) {
                    clickCount++;
                    if (clickCount === 3) playSuccess(); else playTick();
                    const baseStartY = esMovil ? -0.1 : 1.2;
                    const newY = baseStartY - (clickCount * configOriginal.espaciadoY);
                    group.position.y = newY;
                    const s = createScroller(newY, scrollerMessages[clickCount]);
                    scrollers.push(s);
                } else {
                    playTick();
                    clickCount = 0;
                    group.position.set(targetPos.x, targetPos.y, targetPos.z);
                    scrollers.forEach(s => scene.remove(s));
                    scrollers.length = 0;
                    scrollers.push(createScroller(targetPos.y, scrollerMessages[0]));
                }
            }
        }

        window.addEventListener('pointerdown', (event) => {
            handleInteraction(event.clientX, event.clientY);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 0, 5);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);

            const positions = starGeometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i * 3 + 2] += starSpeeds[i];
                if (positions[i * 3 + 2] > 10) {
                    positions[i * 3 + 2] = -30;
                    positions[i * 3] = (Math.random() - 0.5) * 60;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
                }
            }
            starGeometry.attributes.position.needsUpdate = true;
            starField.rotation.z += 0.0005;

            group.rotation.y += 0.035;
            if (clock.getElapsedTime() > 1.5) moveStarted = true;
            if (moveStarted) {
                if (group.position.distanceTo(targetPos) > 0.1 && clickCount === 0) {
                    group.position.lerp(targetPos, 0.12);
                    group.scale.lerp(targetScale, 0.12);
                } else if (!firstScrollerSpawned) {
                    scrollers.push(createScroller(targetPos.y, scrollerMessages[0]));
                    firstScrollerSpawned = true;
                    document.getElementById('instruction').style.opacity = '1';
                    document.getElementById('qr-container').style.opacity = '1';
                }
                scrollers.forEach((s, index) => {
                    const targetXPos = configOriginal.scrollerX;
                    if (s.position.x > targetXPos) { s.position.x -= 0.1; }
                    else {
                        if (s.userData.stopTime === null) s.userData.stopTime = Date.now();
                        if (scrollers.indexOf(s) === 3 && scrollers.length === 4 && (Date.now() - s.userData.stopTime > 100)) {
                            s.visible = Math.floor(clock.getElapsedTime() * 2.0) % 2 === 0;
                        }
                    }
                    const pulse = 1 + Math.sin(clock.getElapsedTime() * 4 + index) * 0.03;
                    s.scale.set(pulse, pulse, 1);
                });
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
