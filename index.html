<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Gemini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            background-color: #f4f4f4;
        }
        #chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 1px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.15); /* Sombra más pronunciada */
            position: relative;
        }
        #chatOutput {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            border-bottom: 8px solid #eee; /* Borde inferior más delgado */
        }
        #chatOutput p {
            margin: 8px 0;
            line-height: 1.5;
        }
        #chatOutput p strong {
            color: #333;
        }
        #chatOutput .thinking {
            color: #888;
            font-style: italic;
        }
        #input-container {
            display: flex;
            padding: 10px; /* Más padding para el contenedor de entrada */
            border-top: 4px solid #eee;
            align-items: center; /* Centrar verticalmente los elementos */
        }
        #userInput {
            flex-grow: 1;
            padding: 12px; /* Más padding */
            border: 1px solid #ccc; /* Borde más delgado */
            border-radius: 5px; /* Bordes más suaves */
            margin-right: 10px; /* Más espacio a la derecha */
            font-size: 16px; /* Tamaño de fuente más grande */
            resize: none;
        }
        #sendButton {
            padding: 12px 20px; /* Más padding para un botón más grande */
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px; /* Bordes más suaves */
            cursor: pointer;
            font-size: 16px; /* Tamaño de fuente más grande */
            transition: background-color 0.40s ease; /* Transición suave al pasar el ratón */
        }
        #sendButton:hover {
            background-color: #0056b3;
        }

        /* Estilos para el cuadro que se adapta al texto */
        #contenedorCuadro {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 4px 4px;
            background-color: #3498db;
            border: 3px solid #2980b9;
            color: white;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 10px 1px 1px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            cursor: pointer;
            border-radius: 1px;
            text-align: center;

            position: absolute;
            z-index: 1000;
        }

        #contenedorCuadro:hover {
            transform: scale(1.1);
        }
    </style>

    <meta name="google-site-verification" content="Y07CzFRTyOVKXp3pfpySdEjCU4i8LgH95O8WwVMH7kQ" />
</head>

<body>
    <div id="chat-container">
        <div id="chatOutput">
            <p id="mainText"><strong>ROBOT DE LLAVES BELLO ANTOQUIA:</strong> ¡Hola! Soy tu asistente de IA . La página está en construcción, Democratización de la IA, Bello Antioquia Colombia </p>
            <div id="contenedorCuadro"></div>
        </div>
        <div id="input-container">
            <textarea id="userInput" placeholder="Escribe tu mensaje..." rows="1"></textarea>
            <button id="sendButton">Enviar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cuadro = document.getElementById('contenedorCuadro');
            const mainTextParagraph = document.getElementById('mainText');
            const userInput = document.getElementById('userInput');

            cuadro.textContent = '';

            const colores = ['#3498db', '#e74c3c', '#27ae60', '#f1c40f', '#9b59b6', '#1abc9c'];
            let indiceColorActual = 0;
            let currentLeftPosition = 0;
            let currentTopPosition = 0;

            let blinkInterval;
            const normalBlinkSpeed = 290; // ¡Ajustado para un parpadeo más rápido!
            const fastBlinkSpeed = 40;

            let isVisible = true; // Variable para controlar la visibilidad

            function toggleVisibilityAndColor() {
                // Alternar visibilidad
                isVisible = !isVisible;
                cuadro.style.opacity = isVisible ? '1' : '0';

                // Cambiar color (siempre, independientemente de la visibilidad)
                indiceColorActual = (indiceColorActual + 1) % colores.length;
                cuadro.style.backgroundColor = colores[indiceColorActual];
                cuadro.style.borderColor = colores[indiceColorActual];
                cuadro.textContent = '';
                positionCuadro();
            }

            function startBlinking(speed) {
                clearInterval(blinkInterval);
                blinkInterval = setInterval(toggleVisibilityAndColor, speed);
            }

            cuadro.addEventListener('click', function() {
                toggleVisibilityAndColor();
            });

            startBlinking(normalBlinkSpeed);

            let typingTimeout;

            userInput.addEventListener('input', function() {
                startBlinking(fastBlinkSpeed);

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    startBlinking(normalBlinkSpeed);
                }, 500);
            });

            userInput.addEventListener('blur', function() {
                clearTimeout(typingTimeout);
                startBlinking(normalBlinkSpeed);
            });

            function positionCuadro() {
                const tempSpan = document.createElement('span');
                tempSpan.textContent = "mundo";
                tempSpan.style.visibility = 'hidden';
                tempSpan.style.position = 'absolute';
                tempSpan.style.whiteSpace = 'nowrap';
                tempSpan.style.fontFamily = mainTextParagraph.style.fontFamily || window.getComputedStyle(mainTextParagraph).fontFamily;
                tempSpan.style.fontSize = mainTextParagraph.style.fontSize || window.getComputedStyle(mainTextParagraph).fontSize;
                tempSpan.style.lineHeight = mainTextParagraph.style.lineHeight || window.getComputedStyle(mainTextParagraph).lineHeight;

                mainTextParagraph.appendChild(tempSpan);

                const textRect = tempSpan.getBoundingClientRect();
                const pRect = mainTextParagraph.getBoundingClientRect();

                const initialLeft = textRect.right - pRect.left + -31;
                const initialTop = textRect.top - pRect.top + (textRect.height / 0.68) - (cuadro.offsetHeight / 2);

                cuadro.style.left = `${initialLeft + currentLeftPosition}px`;
                cuadro.style.top = `${initialTop + currentTopPosition}px`;

                mainTextParagraph.removeChild(tempSpan);
            }

            positionCuadro();
            window.addEventListener('resize', positionCuadro);
        });
    </script>
</body>
</html>
