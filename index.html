<!DOCTYPE html> 
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orión: Llaves Prado</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            font-family: 'Courier New', Courier, monospace;
        }
        #instruction {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            padding: 0 10px;
            box-sizing: border-box;
        }
        #instruction span {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 12px #00ffff;
            border-radius: 20px;
            padding: 8px 15px;
            display: inline-block;
        }
        #qr-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 8px #00ffff;
            border-radius: 8px;
            padding: 6px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95px;
        }
        #qrcode-container {
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: transform 0.2s ease;
        }
        #qrcode-container:hover {
            transform: scale(1.05);
        }
        #qrcode-container img {
            display: block;
            width: 80px;
            height: 80px;
            border-radius: 4px;
        }
        #qr-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 4px;
            pointer-events: none;
        }
        #qr-ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: tickerText 9s linear infinite;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 8px;
            font-weight: bold;
            text-shadow: 0 0 3px #00ffff;
        }
        @keyframes tickerText {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* --- ESTILOS DE LA BURBUJA Y CHAT DE ORIÓN --- */
        #chat-toggle-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(45deg, #00ffcc, #00d2ff);
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            transition: all 0.2s;
        }
        #chat-toggle-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
        }

        #chat-container {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 320px;
            height: 400px;
            background: rgba(5, 5, 10, 0.95);
            border: 1px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            display: none;
            flex-direction: column;
            z-index: 30;
            overflow: hidden;
            box-sizing: border-box;
        }
        #chat-header {
            background: rgba(0, 255, 204, 0.1);
            padding: 10px 15px;
            color: #00ffcc;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #00ffcc44;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-close {
            background: none;
            border: none;
            color: #ff007f;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            line-height: 1.3;
            word-break: break-word;
        }
        .message.user { color: #ff007f; text-align: right; }
        .message.orion { color: #00ffcc; text-align: left; }
        
        #chat-input-area {
            display: flex;
            padding: 8px;
            background: #0a0a0f;
            border-top: 1px solid #00ffcc44;
            gap: 6px;
        }
        #chat-input {
            flex: 1;
            background: #111;
            border: 1px solid #00ffcc55;
            color: #00ffcc;
            padding: 8px;
            border-radius: 4px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }
        #chat-send {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        @media (max-width: 768px) {
            #instruction { font-size: 13px; }
            #instruction span { padding: 5px 10px; }
            #qr-box { bottom: 12px; right: 12px; width: 85px; padding: 5px; }
            #qrcode-container img { width: 70px; height: 70px; }
            #qr-ticker span { font-size: 7px; }
            #chat-container { width: calc(100vw - 40px); height: 350px; left: 20px; bottom: 75px; }
        }
    </style>
</head>
<body>
    <div id="qr-box">
        <div id="qrcode-container" title="Haz clic o detecta el QR">
            <a href="https://llavesprado.github.io" target="_self" id="qr-link">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fllavesprado.github.io" alt="QR Web">
            </a>
        </div>
        <div id="qr-ticker">
            <span>Escanea el código QR para entrar a la página web</span>
        </div>
    </div>

    <!-- BOTÓN Y VENTANA DE CHAT FLOTANTE -->
    <button id="chat-toggle-btn" onclick="toggleChat()">💬 Chatear con Orión</button>
    
    <div id="chat-container">
        <div id="chat-header">
            <span>ORIÓN // NÚCLEO</span>
            <button id="chat-close" onclick="toggleChat()">✕</button>
        </div>
        <div id="chat-messages">
            <div class="message orion"><b>Orión:</b> ¡Hola! Enlace neuronal activo. ¿En qué te colaboro?</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje..." onkeypress="handleKey(event)">
            <button id="chat-send" onclick="enviarMensajeChat()">Enviar</button>
        </div>
    </div>

    <div id="instruction">
        <span>Haz clic sobre las frases usando tu pantalla táctil para llegar a tu destino. - Bello Antioquia, Copyright 2026 &copy;</span>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const esMovil = window.innerWidth <= 768;

        const configOriginal = {
            llaveX: esMovil ? -1.2 : -1.6,       
            llaveYInicio: 0,
            llaveEscala: esMovil ? 0.28 : 0.38,
            scrollerX: esMovil ? 0.65 : 0.8,    
            scrollerInicioX: 6.5,               
            scrollerAncho: esMovil ? 2.3 : 3.4,
            scrollerAlto: esMovil ? 0.50 : 0.85,
            espaciadoY: esMovil ? 0.60 : 0.8
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            osc.start(); 
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccess() {
            [440, 660].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.1));
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.1) + 0.2);
                osc.connect(gain); 
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (i * 0.1));
                osc.stop(audioCtx.currentTime + (i * 0.1) + 0.2);
            });
        }

        function triggerQrFeedback() {
            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 100]);
            }
            if ("speechSynthesis" in window) {
                const utterance = new SpeechSynthesisUtterance("QR detectado");
                utterance.lang = "es-ES";
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const qrContainer = document.getElementById('qrcode-container');
        qrContainer.addEventListener('pointerenter', triggerQrFeedback);
        qrContainer.addEventListener('click', triggerQrFeedback);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const starCount = 1200;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSpeeds = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 60;
            starSpeeds[i] = 0.05 + Math.random() * 0.15;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        const group = new THREE.Group();
        scene.add(group);

        const shape = new THREE.Shape();
        shape.moveTo(0, 1.8); shape.lineTo(0.7, 1.5); shape.lineTo(0.9, 0.9);
        shape.lineTo(0.7, 0.4); shape.lineTo(0.20, 0.1); 
        shape.lineTo(0.38, -0.1); shape.lineTo(0.20, -0.3);
        shape.lineTo(0.38, -0.5); shape.lineTo(0.20, -0.7);
        shape.lineTo(0.38, -0.9); shape.lineTo(0.20, -1.1);
        shape.lineTo(0.38, -1.3); shape.lineTo(0.20, -1.5);
        shape.lineTo(0.38, -1.7); shape.lineTo(0, -2.1); 
        shape.lineTo(-0.20, -1.7); shape.lineTo(-0.20, 0.1);
        shape.lineTo(-0.7, 0.4); shape.lineTo(-0.9, 0.9); 
        shape.lineTo(-0.7, 1.5); shape.lineTo(0, 1.8);
        shape.closePath();

        const hole = new THREE.Path();
        const r = 0.22; const cy = 1.05;
        hole.moveTo(r, cy); hole.lineTo(r * 0.707, cy + r * 0.707);
        hole.lineTo(0, cy + r); hole.lineTo(-r * 0.707, cy + r * 0.707);
        hole.lineTo(-r, cy); hole.lineTo(-r * 0.707, cy - r * 0.707);
        hole.lineTo(0, cy - r); hole.lineTo(r * 0.707, cy - r * 0.707);
        shape.holes.push(hole);

        const lineLeft = new THREE.Path();
        lineLeft.moveTo(-0.08, 0.05); lineLeft.lineTo(-0.08, -1.6);
        lineLeft.lineTo(-0.02, -1.6); lineLeft.lineTo(-0.02, 0.05);
        shape.holes.push(lineLeft);

        const lineRight = new THREE.Path();
        lineRight.moveTo(0.08, 0.05); lineRight.lineTo(0.08, -1.6);
        lineRight.lineTo(0.02, -1.6); lineRight.lineTo(0.02, 0.05);
        shape.holes.push(lineRight);

        const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05 });
        const keyMaterial = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2, emissive: 0x000000 });
        const key = new THREE.Mesh(geom, keyMaterial);
        key.geometry.center();
        group.add(key);

        function createServiceText(zPos, rotationY) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.font = 'bold 100px Arial';
            ctx.fillText('Servicio Tecnico', 512, 500);
            ctx.fillText('3044654556', 512, 600);

            const texture = new THREE.CanvasTexture(canvas);
            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, 
                depthTest: !esMovil 
            }));
            textMesh.renderOrder = 1;
            textMesh.position.set(0, 0.65, zPos);
            textMesh.rotation.y = rotationY;
            return textMesh;
        }
        group.add(createServiceText(0.26, 0));
        group.add(createServiceText(-0.26, Math.PI));

        const scrollers = [];
        const scrollerMessages = ['APERTURAS DE PUERTAS', 'PARA CARRO Y CASA', 'CAMBIO DE CLAVES', '304 465 45 56'];
        const imgLoader = new THREE.TextureLoader();
        const waLogo = imgLoader.load('https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg');

        function createScroller(yPos, text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; 
            canvas.height = 256; 
            const ctx = canvas.getContext('2d');
            ctx.textAlign = 'left';

            if (text === '304 465 45 56') {
                ctx.beginPath();
                ctx.roundRect(10, 15, 630, 225, 45); 
                ctx.fillStyle = 'rgba(0, 20, 40, 0.85)';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 62px Arial';
                ctx.fillText(text, 35, 78);

                const logoSize = 70; 
                if (waLogo.image) ctx.drawImage(waLogo.image, 35, 95, logoSize, logoSize);

                ctx.font = 'bold 70px Arial'; 
                ctx.fillText('WhatsApp', 115, 155);
                ctx.font = 'bold 40px Arial';
                ctx.fillText('haz clic aquí', 115, 205);
            } else {
                ctx.font = 'bold 62px Arial';
                const textWidth = ctx.measureText(text).width;
                
                ctx.beginPath();
                ctx.roundRect(10, 55, textWidth + 60, 130, 60);
                ctx.fillStyle = 'rgba(0, 20, 40, 0.85)';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(text, 40, 142);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(configOriginal.scrollerAncho, configOriginal.scrollerAlto), 
                new THREE.MeshBasicMaterial({ map: texture, transparent: true })
            );
            mesh.position.set(configOriginal.scrollerInicioX, yPos, 0); 
            mesh.userData.stopTime = null; 
            scene.add(mesh);
            return mesh;
        }

        const clock = new THREE.Clock();
        const targetPos = new THREE.Vector3(configOriginal.llaveX, esMovil ? -0.1 : 1.2, 0); 
        const targetScale = new THREE.Vector3(configOriginal.llaveEscala, configOriginal.llaveEscala, configOriginal.llaveEscala);
        let moveStarted = false;
        let firstScrollerSpawned = false;
        let clickCount = 0;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleInteraction(clientX, clientY) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scrollers);
            
            if (intersects.length > 0 && scrollers.indexOf(intersects[0].object) === 3) {
                playSuccess();
                setTimeout(() => {
                    let toggle = 0;
                    const blink = setInterval(() => {
                        key.visible = !key.visible;
                        key.material.emissive.set(Math.random() * 0xffffff);
                        key.material.emissiveIntensity = toggle % 2 === 0 ? 10 : 0;
                        toggle++;
                    }, 5);
                    setTimeout(() => {
                        clearInterval(blink);
                        key.visible = true;
                        key.material.emissiveIntensity = 0;
                        window.open('https://wa.me/573044654556', '_self');
                    }, 50);
                }, 20);
                return;
            }
            
            if (moveStarted) {
                if (clickCount < 3) {
                    clickCount++;
                    if (clickCount === 3) playSuccess(); else playTick();
                    const baseStartY = esMovil ? -0.1 : 1.2;
                    const newY = baseStartY - (clickCount * configOriginal.espaciadoY);
                    group.position.y = newY;
                    const s = createScroller(newY, scrollerMessages[clickCount]);
                    scrollers.push(s);
                } else {
                    playTick();
                    clickCount = 0;
                    group.position.set(targetPos.x, targetPos.y, targetPos.z);
                    scrollers.forEach(s => scene.remove(s));
                    scrollers.length = 0;
                    scrollers.push(createScroller(targetPos.y, scrollerMessages[0]));
                }
            }
        }

        window.addEventListener('pointerdown', (event) => {
            handleInteraction(event.clientX, event.clientY);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 0, 5);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);

            const positions = starGeometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i * 3 + 2] += starSpeeds[i];
                if (positions[i * 3 + 2] > 10) {
                    positions[i * 3 + 2] = -30;
                    positions[i * 3] = (Math.random() - 0.5) * 60;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
                }
            }
            starGeometry.attributes.position.needsUpdate = true;
            starField.rotation.z += 0.0005;

            group.rotation.y += 0.035;
            if (clock.getElapsedTime() > 1.5) moveStarted = true;
            if (moveStarted) {
                if (group.position.distanceTo(targetPos) > 0.1 && clickCount === 0) {
                    group.position.lerp(targetPos, 0.12);
                    group.scale.lerp(targetScale, 0.12);
                } else if (!firstScrollerSpawned) {
                    scrollers.push(createScroller(targetPos.y, scrollerMessages[0]));
                    firstScrollerSpawned = true;
                    document.getElementById('instruction').style.opacity = '1';
                }
                scrollers.forEach((s, index) => {
                    const targetXPos = configOriginal.scrollerX;
                    if (s.position.x > targetXPos) { 
                        s.position.x -= 0.1; 
                    } else {
                        if (s.userData.stopTime === null) s.userData.stopTime = Date.now();
                        if (scrollers.indexOf(s) === 3 && scrollers.length === 4 && (Date.now() - s.userData.stopTime > 100)) {
                            s.visible = Math.floor(clock.getElapsedTime() * 2.0) % 2 === 0;
                        }
                    }
                    const pulse = 1 + Math.sin(clock.getElapsedTime() * 4 + index) * 0.03;
                    s.scale.set(pulse, pulse, 1);
                });
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- LÓGICA DE WEBSOCKETS CON TAILSCALE ---
        let ws;
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        let currentOrionMsg = null;

        window.toggleChat = function() {
            if (chatContainer.style.display === 'flex') {
                chatContainer.style.display = 'none';
            } else {
                chatContainer.style.display = 'flex';
                chatInput.focus();
            }
        };

        function conectarWebSocket() {
            // Conexión segura a través de la red privada de Tailscale con la IP fija
            ws = new WebSocket('ws://100.83.36.2:8080');

            ws.onopen = () => {
                console.log("Enlace neuronal con Orión vía Tailscale establecido.");
                ws.send(JSON.stringify({ type: "ping" }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.response) {
                    if (!currentOrionMsg) {
                        currentOrionMsg = document.createElement('div');
                        currentOrionMsg.className = 'message orion';
                        currentOrionMsg.innerHTML = '<b>Orión:</b> <span class="text-content"></span>';
                        chatMessages.appendChild(currentOrionMsg);
                    }
                    const textSpan = currentOrionMsg.querySelector('.text-content');
                    textSpan.innerText += data.response;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
                if (data.done) {
                    currentOrionMsg = null;
                }
            };

            ws.onclose = () => {
                setTimeout(conectarWebSocket, 2000);
            };
        }
        conectarWebSocket();

        window.enviarMensajeChat = function() {
            const texto = chatInput.value.trim();
            if (!texto) return;

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("El enlace con el servidor de Orión no está activo.");
                return;
            }

            chatMessages.innerHTML += `<div class="message user"><b>Tú:</b> ${texto}</div>`;
            ws.send(JSON.stringify({ prompt: texto }));
            chatInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        window.handleKey = function(e) {
            if (e.key === 'Enter') {
                enviarMensajeChat();
            }
        };
    </script>
</body>
</html>
