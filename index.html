
<!DOCTYPE html>
<html lang="es" style="background-color: #1a1a2e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrajería Llaves - Sincronización Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --cian: #00f0ff; --magenta: #FF00FF; }
        body { font-family: 'Orbitron', sans-serif; background-color: transparent; color: white; }
        
        .chatbot-container { 
            position: relative; height: 350px; display: flex; flex-direction: column; 
            background: #2c2c54; border-radius: 20px; overflow: hidden; 
            border: 2px solid var(--cian); box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }

        /* Avatar */
        .robot-head {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 130px; border-radius: 50%; background: #1a1a2e;
            border: 2px solid var(--cian); z-index: 5;
        }
        .robot-eyes { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; }
        .robot-eye { width: 15px; height: 35px; border-radius: 3px; background: var(--cian); transition: 0.1s; }
        .robot-mouth {
            position: absolute; top: 105px; left: 50%; transform: translateX(-50%); 
            width: 40px; height: 4px; background: var(--cian);
            border-radius: 10px; z-index: 10; transition: transform 0.05s ease-out;
        }

        /* Animaciones de Visemas (Boca) */
        .v-abierta { transform: translateX(-50%) scaleY(6); }
        .v-media { transform: translateX(-50%) scaleY(3); }
        .v-cerrada { transform: translateX(-50%) scaleY(1); }

        .chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-top: 140px; }
        .msg { font-size: 0.75rem; padding: 8px; border-radius: 10px; max-width: 85%; }
        .bot { background: #3f3f6e; border: 1px solid var(--cian); align-self: flex-start; color: var(--cian); }
        .user { background: #4a90e2; align-self: flex-end; }

        .input-area { display: flex; padding: 10px; background: #111122; gap: 5px; }
        input { flex-grow: 1; background: #2c2c54; border: 1px solid var(--cian); border-radius: 15px; padding: 5px 15px; color: white; font-size: 0.8rem; }
        button { background: var(--cian); color: #111122; font-weight: bold; padding: 5px 15px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="chatbot-container">
        <div class="robot-head"></div>
        <div class="robot-eyes">
            <div id="eye-l" class="robot-eye"></div>
            <div id="eye-r" class="robot-eye"></div>
        </div>
        <div id="mouth" class="robot-mouth"></div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">Hola. Soy tu asistente de Cerrajería Llaves. ¿En qué te ayudo?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Pregunta por precios o servicios...">
            <button onclick="enviar()">OK</button>
        </div>
    </div>

    <script>
        const mouth = document.getElementById('mouth');
        const eyes = [document.getElementById('eye-l'), document.getElementById('eye-r')];
        const chatBox = document.getElementById('chatBox');
        let animFrame;

        // Lógica de Visemas simplificada por vocales
        function getVisema(char) {
            if (!char) return 'v-cerrada';
            const v = char.toUpperCase();
            if (['A', 'O'].includes(v)) return 'v-abierta';
            if (['E', 'I', 'U'].includes(v)) return 'v-media';
            return 'v-cerrada';
        }

        function hablar(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;

            // SINCRONIZACIÓN REAL: Ocurre cada vez que la voz dice una palabra
            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const word = texto.substr(event.charIndex, event.charLength);
                    const vocal = word.match(/[aeiou]/i); // Busca la primera vocal de la palabra
                    
                    mouth.className = 'robot-mouth ' + getVisema(vocal ? vocal[0] : null);
                    
                    // Cierra la boca ligeramente después de cada palabra para efecto natural
                    setTimeout(() => {
                        if (window.speechSynthesis.speaking) mouth.className = 'robot-mouth v-cerrada';
                    }, 150);
                }
            };

            utterance.onstart = () => {
                eyes.forEach(e => e.style.background = '#00FF00');
            };

            utterance.onend = () => {
                mouth.className = 'robot-mouth v-cerrada';
                eyes.forEach(e => e.style.background = '#00f0ff');
            };

            window.speechSynthesis.speak(utterance);
        }

        function enviar() {
            const input = document.getElementById('userInput');
            const userText = input.value.trim().toLowerCase();
            if (!userText) return;

            addMsg(input.value, 'user');
            input.value = '';

            let respuesta = "Lo siento, no entendí. Puedes preguntarme por el precio del cambio de clave.";

            // Lógica de Negocio
            if (userText.includes("clave") || userText.includes("precio") || userText.includes("cuanto cuesta")) {
                respuesta = "El servicio de cambio de clave para tu cerradura cuesta 45.000 pesos. ¿Deseas que te enviemos un cerrajero?";
            } else if (userText.includes("hola")) {
                respuesta = "¡Hola! Bienvenido a Cerrajería Llaves. Te recordamos que el cambio de clave vale 45.000 pesos. ¿En qué te puedo ayudar?";
            }

            setTimeout(() => {
                addMsg(respuesta, 'bot');
                hablar(respuesta);
            }, 400);
        }

        function addMsg(txt, tipo) {
            const d = document.createElement('div');
            d.className = `msg ${tipo}`;
            d.textContent = txt;
            chatBox.appendChild(d);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Parpadeo automático
        setInterval(() => {
            eyes.forEach(e => e.style.transform = 'scaleY(0.1)');
            setTimeout(() => eyes.forEach(e => e.style.transform = 'scaleY(1)'), 100);
        }, 4000);
    </script>
</body>
</html>
