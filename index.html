<!DOCTYPE html>
<html lang="es" style="background-color: #1a1a2e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrajería Llaves - Sincronización Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --cian: #00f0ff; }
        body { font-family: 'Orbitron', sans-serif; background: transparent; color: white; overflow: hidden; }
        
        .chatbot-container { 
            position: relative; height: 380px; display: flex; flex-direction: column; 
            background: #2c2c54; border-radius: 20px; border: 2px solid var(--cian);
            box-shadow: 0 0 20px rgba(0,240,255,0.2); margin: 10px;
        }

        /* Avatar */
        .robot-head {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 120px; border-radius: 50%; background: #1a1a2e;
            border: 2px solid var(--cian); z-index: 5;
        }
        .robot-eyes { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; }
        .robot-eye { width: 14px; height: 35px; border-radius: 3px; background: var(--cian); transition: 0.1s; }
        .robot-mouth {
            position: absolute; top: 95px; left: 50%; transform: translateX(-50%); 
            width: 40px; height: 4px; background: var(--cian);
            border-radius: 10px; z-index: 10; transition: transform 0.1s ease-out;
        }

        /* Estados de Boca */
        .mouth-open { transform: translateX(-50%) scaleY(6); }
        .mouth-closed { transform: translateX(-50%) scaleY(1); }

        .chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-top: 135px; }
        .msg { font-size: 0.75rem; padding: 8px; border-radius: 10px; max-width: 85%; border: 1px solid rgba(0,240,255,0.2); }
        .bot { background: #3f3f6e; align-self: flex-start; color: var(--cian); }
        .user { background: #4a90e2; align-self: flex-end; color: white; }

        .input-area { display: flex; padding: 10px; background: #111122; gap: 5px; }
        input { flex-grow: 1; background: #2c2c54; border: 1px solid var(--cian); border-radius: 10px; padding: 8px; color: white; font-size: 0.8rem; outline: none; }
        button { background: var(--cian); color: #111122; font-weight: bold; padding: 8px 15px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="chatbot-container">
        <div class="robot-head"></div>
        <div class="robot-eyes">
            <div id="eye-l" class="robot-eye"></div>
            <div id="eye-r" class="robot-eye"></div>
        </div>
        <div id="mouth" class="robot-mouth"></div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">Sistema iniciado. Pregúntame por el cambio de clave.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe aquí...">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        const mouth = document.getElementById('mouth');
        const eyes = [document.getElementById('eye-l'), document.getElementById('eye-r')];
        const chatBox = document.getElementById('chatBox');
        let mouthTimer;

        // Función de animación forzada por sílabas
        function animarBoca(texto) {
            clearTimeout(mouthTimer);
            const palabras = texto.split(" ");
            let tiempoAcumulado = 0;

            palabras.forEach((palabra) => {
                // Por cada palabra, abrimos y cerramos la boca según su longitud
                const duracionPalabra = palabra.length * 80; // ms por letra aprox
                
                setTimeout(() => {
                    if (window.speechSynthesis.speaking) {
                        mouth.classList.add('mouth-open');
                        eyes.forEach(e => e.style.background = '#00FF00');
                    }
                }, tiempoAcumulado);

                tiempoAcumulado += duracionPalabra * 0.6;

                setTimeout(() => {
                    mouth.classList.remove('mouth-open');
                }, tiempoAcumulado);

                tiempoAcumulado += duracionPalabra * 0.4;
            });

            // Asegurar cierre al final
            setTimeout(() => {
                mouth.classList.remove('mouth-open');
                eyes.forEach(e => e.style.background = '#00f0ff');
            }, tiempoAcumulado + 500);
        }

        function hablar(texto) {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(texto);
            ut.lang = 'es-ES';
            ut.rate = 1.0;
            ut.pitch = 1.1;

            ut.onstart = () => animarBoca(texto);
            ut.onend = () => {
                mouth.classList.remove('mouth-open');
                eyes.forEach(e => e.style.background = '#00f0ff');
            };

            window.speechSynthesis.speak(ut);
        }

        function enviar() {
            const input = document.getElementById('userInput');
            const userText = input.value.trim().toLowerCase();
            if (!userText) return;

            addMsg(input.value, 'user');
            input.value = '';

            let respuesta = "Para ese servicio técnico, el costo base es de 45.000 pesos. ¿Te gustaría agendarlo?";

            if (userText.includes("clave") || userText.includes("precio") || userText.includes("cuanto cuesta")) {
                respuesta = "El cambio de clave para tu cerradura tiene un valor de 45.000 pesos netos. Incluye garantía técnica.";
            } else if (userText.includes("hola")) {
                respuesta = "¡Hola! Soy tu asistente de Cerrajería Llaves. El cambio de clave hoy está en 45.000 pesos. ¿Cómo puedo ayudarte?";
            }

            setTimeout(() => {
                addMsg(respuesta, 'bot');
                hablar(respuesta);
            }, 300);
        }

        function addMsg(txt, tipo) {
            const d = document.createElement('div');
            d.className = `msg ${tipo}`;
            d.textContent = txt;
            chatBox.appendChild(d);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Parpadeo automático cada 4 segundos
        setInterval(() => {
            if (!window.speechSynthesis.speaking) {
                eyes.forEach(e => e.style.transform = 'scaleY(0.1)');
                setTimeout(() => eyes.forEach(e => e.style.transform = 'scaleY(1)'), 150);
            }
        }, 4000);
    </script>
</body>
</html>
